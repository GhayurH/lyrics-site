name: One-time Basta title and tercet validation
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[verify-basta-tercets]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify title alignment, tercet grouping, Basta index and published IDs
        shell: bash
        run: |
          npm ci
          npm test
          npm run check
          node scripts/sync-basta-index.mjs --check
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          git diff --check
      - name: Remove temporary workflow after all checks
        shell: bash
        run: |
          rm -f .github/workflows/one-time-basta-title-tercets.yml
          git add -A .github/workflows/one-time-basta-title-tercets.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Remove completed Basta title and tercet diagnostic [skip ci]"
          git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05
