# Temporary job: push executes it once and the cleanup commit deletes this file.
name: One-time canonical Bibi ZWNJ cleanup
on:
  push:
    branches:
      - round2-kalams-2026-11-14
    paths:
      - .github/workflows/one-time-bibi-zwnj.yml
permissions:
  contents: write
concurrency:
  group: round2-bibi-zwnj-one-shot
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/round2-kalams-2026-11-14'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove U+200C from every tracked Markdown file
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const files = execFileSync('git', ['ls-files', '-z']).toString('utf8').split('\0')
            .filter(path => path.endsWith('.md'));
          let changed = 0, removed = 0;
          for (const file of files) {
            const before = readFileSync(file, 'utf8');
            const count = (before.match(/\u200C/gu) || []).length;
            if (!count) continue;
            writeFileSync(file, before.replace(/\u200C/gu, ''), 'utf8');
            changed++;
            removed += count;
          }
          console.log('Removed', removed, 'ZWNJs from', changed, 'of', files.length, 'Markdown files');
          NODE
      - name: Reapply canonical standalone Bibi spelling in Basta and lyrics
        run: node --experimental-strip-types scripts/normalize-bibi.mjs --write
      - name: Run focused Bibi spelling tests (not CI suite)
        run: node --experimental-strip-types --test --test-name-pattern='Bibi|non-joiner|standalone Urdu' tests/source-review.test.mjs
      - name: Confirm no noncanonical ZWNJ remains in any Markdown
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { stripCanonicalBibiNonJoiners } from './src/lib/bibi-spelling.ts';
          const files = execFileSync('git', ['ls-files', '-z']).toString('utf8').split('\0')
            .filter(path => path.endsWith('.md'));
          let canonical = 0;
          for (const file of files) {
            const content = readFileSync(file, 'utf8');
            const invalid = stripCanonicalBibiNonJoiners(content);
            if (invalid.includes('\u200C')) throw Error('Noncanonical ZWNJ in ' + file);
            canonical += (content.match(/\u200C/gu) || []).length;
          }
          console.log('Verified', files.length, 'Markdown files;', canonical,
            'canonical standalone Bibi non-joiners remain');
          NODE
      - name: Commit results and remove this temporary workflow
        shell: bash
        env:
          TARGET_BRANCH: round2-kalams-2026-11-14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-bibi-zwnj.yml
          git add -u
          git commit -m "Apply one-time ZWNJ cleanup to all Markdown [skip ci]"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
