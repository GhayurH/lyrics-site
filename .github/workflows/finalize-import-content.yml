name: One-time language and stanza finalization
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[finish-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify latest main is included
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Finish source-aware language and stanza normalization
        run: |
          python3 -m py_compile scripts/finalize-import-content.py
          python3 scripts/finalize-import-content.py
      - name: Validate stable lyric IDs and collect findings
        run: |
          npm ci
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          npm run content:review -- --summary
      - name: Commit results and remove one-time scripts
        run: |
          rm -f scripts/finalize-import-content.py .github/workflows/finalize-import-content.yml
          rm -rf scripts/__pycache__
          git add -A src/data/lyrics src/content.config.ts src/lib/source-review.ts src/pages/lyrics/'[id].astro' src/pages/data/recitation-lyrics/'[id].json.ts' audit scripts/finalize-import-content.py .github/workflows/finalize-import-content.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Finalize lyric language, metadata, stanza numbering and provenance"
          git push origin "HEAD:feat/import-overlap-reconciliation-2026-11-05"
