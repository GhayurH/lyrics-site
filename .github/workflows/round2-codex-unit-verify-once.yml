name: One-time verify Round 2 systemd user unit
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths:
      - scripts/kalam_codex_worker.py
      - tests/test_kalam_codex_worker.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile CLI
        run: python3 -m py_compile scripts/kalam_codex_worker.py scripts/kalam_codex.py scripts/kalam_codex_isolation.py scripts/kalam_codex_quality.py
      - name: Test supervisor and systemd unit
        run: python3 -m unittest discover -s tests -p 'test_kalam_codex*.py' -v
      - name: Validate CLI service preview without launching it
        run: |
          python3 scripts/kalam_codex.py service --help
          git diff --check
