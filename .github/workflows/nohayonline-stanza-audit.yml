name: Repair NoHayOnline stanza structure
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-stanza-audit.yml]
permissions:
  contents: write
concurrency:
  group: nohayonline-stanza-repair-2026-11-06
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install pyyaml
      - name: Apply conservative editorial stanza fixes
        run: python .github/scripts/repair_nohayonline_once.py
      - name: Verify diff
        run: git diff --check
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate content and build site
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
      - name: Save cases needing individual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nohayonline-stanza-review
          path: nohayonline-stanza-review.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit the fixes without one-time scripts
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/nohayonline-stanza-audit.yml .github/scripts/repair_nohayonline_once.py
          git add -- src/data/lyrics/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Repair NoHayOnline stanza boundaries"
          git push origin HEAD:refs/heads/feat/import-overlap-reconciliation-2026-11-05
