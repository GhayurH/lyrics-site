name: Validate next manual NoHayOnline batch
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-stanza-triage.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Validate changed stanza boundaries and unchanged metadata
        run: |
          python - <<'PY'
          import subprocess, re, pathlib, yaml, collections
          base='86c42ac0efc0895558f4680a0a9da65dc67490d3'
          changed=[x for x in subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines() if x.endswith('.md')]
          assert len(changed)==28, f'Expected 28 manual corrections, found {len(changed)}'
          pat=re.compile(r'^---\n(.*?)\n---\n(.*)$',re.S)
          numeric=re.compile(r'^[0-9۰-۹٠-٩]+$')
          def load(s):
              match=pat.fullmatch(s)
              assert match, 'Bad frontmatter delimiter'
              return yaml.safe_load(match[1]),match[2],[x for x in match[1].splitlines() if x.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
          def split(t,urdu):
              digits='۰۱۲۳۴۵۶۷۸۹'
              number=[]
              groups=[[]]
              for s in t.splitlines():
                  s=s.strip()
                  if not s: continue
                  if numeric.fullmatch(s):
                      number.append(s)
                      groups.append([])
                  else:
                      groups[-1].append(s)
              exp=[str(i).translate(str.maketrans('0123456789',digits)) if urdu else str(i) for i in range(1,len(number)+1)]
              assert number==exp, f'Invalid numbering {number} != {exp}'
              assert number and all(groups), f'Empty opening or stanza {list(map(len,groups))}'
              return len(number),len(groups[0]),sum(map(len,groups))
          for path in changed:
              old=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              now=pathlib.Path(path).read_text()
              assert '# source_id: nohayonline:' in old, f'Unexpected source: {path}'
              o,ou,oc=load(old);n,nu,nc=load(now)
              assert isinstance(o,dict) and isinstance(n,dict)
              assert {k:v for k,v in o.items() if k!='romanLyrics'}=={k:v for k,v in n.items() if k!='romanLyrics'}, f'Unexpected metadata change in {path}'
              assert oc==nc, f'Lost provenance {path}'
              assert o.get('published') is False and n.get('published') is False, f'Unexpected publication status {path}'
              assert isinstance(n.get('romanLyrics'),str), f'Roman missing {path}'
              r=split(n['romanLyrics'],False);u=split(nu,True)
              assert r[0]==u[0],f'Stanza misalignment {path}: roman {r[0]} Urdu {u[0]}'
              assert r[1]>0 and u[1]>0, f'Missing preamble {path}'
              print(f'OK {path} stanzas={r[0]} opening Roman/Urdu={r[1]}/{u[1]} lines={r[2]}/{u[2]}')
          print(f'VERIFIED {len(changed)} manually reviewed files')
          PY
      - name: Check patch whitespace
        run: git diff --check 86c42ac0efc0895558f4680a0a9da65dc67490d3 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Site checks, tests and production build
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
