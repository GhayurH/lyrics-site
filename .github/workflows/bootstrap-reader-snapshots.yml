# File role: One-time bootstrap for reviewed Chromium golden images on the feature branch.
name: Bootstrap reader screenshots
on:
  push:
    branches: ["feat/unified-reader-ux-2026-10"]
permissions:
  contents: write
jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, 'Record reader screenshot baselines')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Generate golden references
        run: npx playwright test tests/browser/layout-snapshots.spec.mjs --project=chromium --update-snapshots
      - name: Commit golden references
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser/layout-snapshots.spec.mjs-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m 'Record reader screenshot baselines'
            git push origin HEAD:feat/unified-reader-ux-2026-10
          fi
