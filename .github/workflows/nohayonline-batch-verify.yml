name: Validate next NoHayOnline manual batch
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-batch-verify.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Audit manual content edits, metadata and stanza numbering
        run: |
          python - <<'PY'
          import pathlib,re,subprocess,yaml
          base='348af5116d94103d79cc68686cc5ce62857c8069'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines()
          assert len(changed)==22,(len(changed),changed)
          fm_re=re.compile(r'^---\n(.*?)\n---\n(.*)$',re.S)
          number_re=re.compile(r'^[0-9۰-۹٠-٩]+$')
          def parse(s):
              m=fm_re.fullmatch(s)
              assert m,'Malformed frontmatter'
              front=yaml.safe_load(m.group(1))
              assert isinstance(front,dict)
              comments=[l for l in m.group(1).splitlines() if l.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
              return front,m.group(2),comments
          def analyze(text,urdu):
              nums=[]
              groups=[[]]
              for line in text.splitlines():
                  v=line.strip()
                  if not v: continue
                  if number_re.fullmatch(v):
                      nums.append(v)
                      groups.append([])
                  else:
                      groups[-1].append(v)
              d=str.maketrans('0123456789','۰۱۲۳۴۵۶۷۸۹')
              wanted=[str(i).translate(d) if urdu else str(i) for i in range(1,len(nums)+1)]
              assert nums==wanted,('Bad stanza numbering',nums,wanted)
              assert len(nums)>0 and all(groups),'Missing opening or empty stanza'
              return len(nums),[len(g) for g in groups]
          for file in changed:
              old=subprocess.check_output(['git','show',f'{base}:{file}'],text=True)
              new=pathlib.Path(file).read_text()
              assert '# source_id: nohayonline:' in old, file
              before,_,old_comments=parse(old)
              after,urdu,new_comments=parse(new)
              assert {k:v for k,v in before.items() if k!='romanLyrics'}=={k:v for k,v in after.items() if k!='romanLyrics'},f'Metadata changed: {file}'
              assert old_comments==new_comments,f'Provenance changed: {file}'
              assert before.get('published') is False and after.get('published') is False,f'Publication state changed: {file}'
              assert isinstance(after.get('romanLyrics'),str),f'Missing Roman lyrics: {file}'
              R=analyze(after['romanLyrics'],False)
              U=analyze(urdu,True)
              assert R[0]==U[0],f'Urdu/Roman stanza counts differ: {file} {R[0]} {U[0]}'
              print('OK',file,'stanzas',R[0],'Roman',R[1],'Urdu',U[1])
          print('VERIFIED',len(changed),'NoHayOnline manual corrections; metadata and numbering preserved')
          PY
      - name: Validate whitespace
        run: git diff --check 348af5116d94103d79cc68686cc5ce62857c8069 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run Astro checks, tests and production build
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
