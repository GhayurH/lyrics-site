name: Validate 51 NoHayOnline stanza reconciliations
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-batch-verify.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Verify lyrics, provenance, unchanged opening and stanza numbering
        run: |
          python - <<'PY'
          import collections,pathlib,re,subprocess,yaml
          base='aa7b6ce266b1e2d0f454f9cba6e027656a587f21'
          files=[p for p in subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines() if p.endswith('.md')]
          assert len(files)==51,('Unexpected file count',len(files),files)
          fm=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          mark=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          abbreviated=re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          digits=str.maketrans('0123456789','۰۱۲۳۴۵۶۷۸۹')
          def parse(text):
              m=fm.fullmatch(text)
              assert m, 'Malformed YAML frontmatter'
              f=yaml.safe_load(m[1])
              assert isinstance(f,dict)
              comments=[t for t in m[1].splitlines() if t.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
              return f,m[2],comments
          def words(t):
              return [v for line in t.splitlines() if (v:=line.strip()) and not mark.fullmatch(v)]
          def compare(old,new,path,script):
              a,b=words(old),words(new)
              ca,cb=collections.Counter(a),collections.Counter(b)
              assert not(cb-ca),(path,script,'new or rewritten lyrics',cb-ca)
              lost=ca-cb
              normal=lambda s:re.sub(r'[\s.۔…]+','',s.casefold())
              for line,num in lost.items():
                  assert abbreviated.search(line),(path,script,'substantive line removed',line)
                  assert sum(n for t,n in ca.items() if normal(t)==normal(line))>=2,(
                      path,script,'nonrepeated line removed',line)
              cursor=iter(a)
              for line in b:
                  assert any(x==line for x in cursor),(path,script,'line order changed',line)
              return sum(lost.values())
          def groups(t,urdu):
              result=[[]];nums=[]
              for line in t.splitlines():
                  value=line.strip()
                  if not value:continue
                  if mark.fullmatch(value):nums.append(value);result.append([])
                  else:result[-1].append(value)
              wanted=[str(i).translate(digits) if urdu else str(i) for i in range(1,len(nums)+1)]
              assert nums==wanted,('Bad stanza numbering',nums,wanted)
              assert nums and all(result),('Empty opening or stanza',[len(x) for x in result])
              assert all(len(g)>=2 for g in result[1:]),'One-line numbered stanza'
              return result
          total=collections.Counter()
          for path in files:
              oldtext=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              newtext=pathlib.Path(path).read_text()
              assert '# source_id: nohayonline:' in oldtext,('Unexpected source',path)
              before,urdu0,prov0=parse(oldtext)
              after,urdu1,prov1=parse(newtext)
              assert before.get('published') is False and after.get('published') is False,('Publication changed',path)
              assert {k:v for k,v in before.items() if k!='romanLyrics'}=={k:v for k,v in after.items() if k!='romanLyrics'},('Metadata changed',path)
              assert prov0==prov1,('Provenance changed',path)
              r0,r1=before.get('romanLyrics'),after.get('romanLyrics')
              assert isinstance(r0,str) and isinstance(r1,str),('Missing Roman',path)
              total['Roman shorthand']+=compare(r0,r1,path,'Roman')
              total['Urdu shorthand']+=compare(urdu0,urdu1,path,'Urdu')
              rg,ug=groups(r1,False),groups(urdu1,True)
              assert len(rg)==len(ug),(path,'Different numbered stanza counts')
              assert [len(g) for g in rg]==[len(g) for g in ug],(path,'Urdu/Roman stanza boundary mismatch')
              assert rg[0]==groups(r0,False)[0] and ug[0]==groups(urdu0,True)[0],(
                  path,'Changed opening passage')
              print('PASS',path,'stanzas',len(rg)-1,'opening',len(rg[0]))
          print('VERIFIED',len(files),'NoHayOnline lyrics; removed',dict(total))
          PY
      - name: Check whitespace
        run: git diff --check aa7b6ce266b1e2d0f454f9cba6e027656a587f21 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Astro checks, tests, production build and search
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
