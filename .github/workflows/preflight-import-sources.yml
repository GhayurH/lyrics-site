name: One-time independent import source checks
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[source-diagnostics]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run every source stage separately (non-mutating)
        shell: bash
        run: |
          set +e
          for script in "normalize-bibi.mjs --check" "normalize-roman.mjs --check" "sync-basta-index.mjs --check" "recitation-identities.mjs --check" "review-content.mjs --summary --regression"; do
            echo "======= $script ======="
            node --experimental-strip-types scripts/$script
            echo "======= exit status $? ======="
          done
