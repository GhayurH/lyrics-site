name: Inspect NoHayOnline poem boundaries
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-next-batch-scan.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Rank poems by refrain-based stanza segmentation
        run: |
          python - <<'PY'
          import collections,pathlib,re,statistics,subprocess,yaml
          old='86c42ac0efc0895558f4680a0a9da65dc67490d3'
          edited={pathlib.Path(s).stem for s in subprocess.check_output(['git','diff','--name-only',old,'HEAD','--','src/data/lyrics'],text=True).splitlines()}
          fm=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          marker=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          abbr=re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          def groups(t):
              g=[[]]
              for s in t.splitlines():
                  v=s.strip()
                  if not v:continue
                  if marker.fullmatch(v):g.append([])
                  else:g[-1].append(v)
              return g
          def count(text):
              g=groups(text)
              f=collections.Counter(re.sub(r'[\s.…۔]+','',v.casefold()) for block in g for v in block if abbr.search(v))
              a=[v for block in g for v in block if abbr.search(v)]
              segments=[];cur=[]
              for v in [v for block in g[1:] for v in block]:
                  if abbr.search(v):
                      if cur:
                          segments.append(cur);cur=[]
                  else:cur.append(v)
              if cur:segments.append(cur)
              return g,len(a),f,segments
          good=[]
          for p in pathlib.Path('src/data/lyrics').glob('*.md'):
              if p.stem in edited or p.stem in ('beton-ki-maa','mujhe-paidal-chalna'):continue
              text=p.read_text()
              if '# source_id: nohayonline:' not in text:continue
              m=fm.fullmatch(text)
              if not m:continue
              try:front=yaml.safe_load(m[1])
              except:continue
              if not isinstance(front,dict) or not isinstance(front.get('romanLyrics'),str):continue
              R,rc,rf,rs=count(front['romanLyrics'])
              U,uc,uf,us=count(m[2])
              lengths=[len(b) for b in rs]
              if len(R)!=len(U) or rc<3 or uc<3 or min(rf.values(),default=0)<2 or min(uf.values(),default=0)<2:continue
              if [len(x) for x in rs]!=[len(x) for x in us] or len(rs)<5 or min(lengths)<2:continue
              if len(R[0])!=len(U[0]) or min(len(R[0]),len(U[0]))<2:continue
              compact=sum(3<=x<=6 for x in lengths)/len(lengths)
              if compact<.75 or lengths[0]>12:continue
              score=40*compact+len(rs)*.5-min(10,lengths[0])*1.4+min(12,rc*.4)
              good.append((score,p.stem,len(R[0]),lengths,rc,uc,R[0][:2],rs[0][:2],rs[-1][-2:]))
          good.sort(reverse=True)
          print('COHERENT_REFRAIN_BOUNDARIES',len(good))
          for i,(score,slug,opening,blocks,rc,uc,intro,first,last) in enumerate(good[:200],1):
              print(f'ITEM {i:03d} {slug} score={score:.1f} intro={opening} groups={blocks} short={rc}/{uc} start={intro} first={first} end={last}')
          PY
