name: Review main content duplicates
on:
  push:
    branches:
      - audit/main-lyric-content-duplicates-2026-11-16
    paths:
      - tools/duplicate_lyrics_report.py
      - .github/workflows/duplicate-content-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate read-only Roman and Urdu review report
        run: |
          python3 tools/duplicate_lyrics_report.py \
            --sha ff0c165f58bc78d97db8c3e834bb6a65bd23b6cf \
            --output audit/main-content-duplicate-review.html | tee audit/main-content-duplicate-summary.json
      - name: Save downloadable report
        uses: actions/upload-artifact@v4
        with:
          name: main-content-duplicate-review
          path: |
            audit/main-content-duplicate-review.html
            audit/main-content-duplicate-summary.json
          retention-days: 30
      - name: Commit report to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/main-content-duplicate-review.html audit/main-content-duplicate-summary.json
          git commit -m 'Add HTML duplicate review for 3380 main kalams'
          git push origin "HEAD:${GITHUB_REF_NAME}"
