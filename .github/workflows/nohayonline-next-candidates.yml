name: Verify 56 manually corrected NoHayOnline poems
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-next-candidates.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Check stanza text, numbering and metadata on all edited files
        run: |
          python - <<'PY'
          import collections,pathlib,re,subprocess,yaml
          base='011e935a6850274fb6a4545ff54b70fb7d228dc4'
          changed=[x for x in subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines() if x.endswith('.md')]
          assert len(changed)==56,f'Expected 56 edited files; found {len(changed)}'
          frontmatter=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          marker=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          digit_map=str.maketrans('0123456789','۰۱۲۳۴۵۶۷۸۹')
          def parse(raw):
              m=frontmatter.fullmatch(raw)
              assert m,'Malformed frontmatter'
              obj=yaml.safe_load(m.group(1))
              assert isinstance(obj,dict),'Invalid YAML metadata'
              comments=[line for line in m.group(1).splitlines() if line.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
              return obj,m.group(2),comments
          def text_lines(s):
              return [v for x in s.splitlines() if (v:=x.strip()) and not marker.fullmatch(v)]
          def split(s,urdu):
              g=[[]]
              nums=[]
              for line in s.splitlines():
                  val=line.strip()
                  if not val: continue
                  if marker.fullmatch(val):
                      nums.append(val)
                      g.append([])
                  else: g[-1].append(val)
              want=[str(i).translate(digit_map) if urdu else str(i) for i in range(1,len(nums)+1)]
              assert nums==want,f'Incorrect numbering: {nums} expected {want}'
              assert nums and all(g),f'Empty preamble or stanza: {[len(x) for x in g]}'
              return g
          def subsequence(old,new):
              stream=iter(text_lines(old))
              for line in text_lines(new):
                  if not any(prev==line for prev in stream):
                      return False
              return True
          removed=collections.Counter()
          for path in changed:
              old=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              new=pathlib.Path(path).read_text()
              assert '# source_id: nohayonline:' in old,f'Unexpected source {path}'
              before,old_urdu,old_comments=parse(old)
              after,new_urdu,new_comments=parse(new)
              assert before.get('published') is False and after.get('published') is False,f'Published state changed {path}'
              assert {k:v for k,v in before.items() if k!='romanLyrics'}=={k:v for k,v in after.items() if k!='romanLyrics'},f'Metadata changed {path}'
              assert old_comments==new_comments,f'Provenance lost {path}'
              r_before=before.get('romanLyrics')
              r_after=after.get('romanLyrics')
              assert isinstance(r_before,str) and isinstance(r_after,str),f'Missing Roman text {path}'
              assert subsequence(r_before,r_after),f'Roman substantive wording changed or reordered: {path}'
              assert subsequence(old_urdu,new_urdu),f'Urdu substantive wording changed or reordered: {path}'
              roman=split(r_after,False)
              urdu=split(new_urdu,True)
              assert len(roman)==len(urdu),f'Roman/Urdu stanza-count mismatch {path}'
              assert [len(s) for s in roman]==[len(s) for s in urdu],f'Roman/Urdu stanza boundaries mismatch {path}'
              removed['roman']+=len(text_lines(r_before))-len(text_lines(r_after))
              removed['urdu']+=len(text_lines(old_urdu))-len(text_lines(new_urdu))
              print(f'OK {path} stanzas={len(roman)-1} opening_lines={len(roman[0])} lines={sum(map(len,roman))}')
          print(f'VERIFIED {len(changed)} manual NoHayOnline corrections; deleted repeated refrain fragments {dict(removed)}; original surviving lines, ordering, metadata, provenance and aligned stanza counts verified')
          PY
      - name: Check patch whitespace
        run: git diff --check 011e935a6850274fb6a4545ff54b70fb7d228dc4 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check, test, build Astro, Pagefind and offline search
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
