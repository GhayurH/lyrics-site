name: Temporary centralized source workflow validation
on:
  push:
    branches:
      - chore/resolve-astro-check-hints-2026-11-02
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read-only unified source validation
        run: npm run source:check
      - name: Synchronize sources and prove idempotence
        shell: bash
        run: |
          npm run source:sync
          git diff --exit-code -- src/data
      - name: Simulate a reviewed fragment opening changing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/data/basta/pages/094.md')
          text=path.read_text()
          old='اک سمت شہیدوں میں غریب الوطنی ہے'
          assert text.count(old)==1
          path.write_text(text.replace(old,old+'!'))
          PY
          if npm run basta:fragments:check; then
            echo 'Expected to reject the stale reviewed opening'
            exit 1
          fi
          npm run source:sync -- --approve-fragments=94
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const roles=JSON.parse(readFileSync('src/data/basta/fragment-roles.json','utf8'));
          if (roles.fragments['94:2'].opening !== 'اک سمت شہیدوں میں غریب الوطنی ہے!')
            throw Error('Explicitly approved opening was not saved');
          NODE
          git checkout -- src/data/basta/pages/094.md src/data/basta/fragment-roles.json
          git diff --exit-code -- src/data
          npm run source:check
      - name: Verify Astro type checks
        run: npm run check
      - name: Verify production build including Pagefind and offline index
        run: |
          npm run build
          test -f dist/pagefind/pagefind.js
          test -f dist/data/offline-search-assets.json
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browser
