name: Export content snapshot for editorial dedup
on:
  push:
    branches: [fix/main-content-dedup-2026-11-16]
    paths: [.github/workflows/content-snapshot-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact committed source Markdown and cohort ledger
        run: |
          tar -czf lyrics-main-snapshot.tar.gz src/data/lyrics audit/lyric-md-rounds.csv docs/TRANSLITERATION.md
          printf '%s\n' "$(git rev-parse HEAD)" > snapshot-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: main-lyrics-source-snapshot
          path: |
            lyrics-main-snapshot.tar.gz
            snapshot-sha.txt
          retention-days: 7
