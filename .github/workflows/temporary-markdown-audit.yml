name: Temporary Markdown corpus audit
on:
  push:
    branches: [fix/urdu-font-sizing-and-yeh-normalization]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/one-off-markdown-cleanup.mjs --write
      - name: Validate normalized source and build
        run: |
          npm ci
          npm run build
      - name: Commit corrected content
        run: |
          if ! git diff --quiet -- src/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git diff --cached --check
            git commit -m "Fix Urdu glyph mixups and Markdown punctuation"
            git push
          fi
