# Temporary PR-readiness job; remove after verification.
name: Transliteration branch merge validation
on:
  push:
    branches: [feat/roman-transliteration-standard-2026-11-04]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check full branch diff for whitespace errors
        shell: bash
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" diff --check origin/main...HEAD
          test ! -e src/lib/roman-text-parts.ts
          ! git ls-files '.github/workflows/*migration*' '.github/workflows/*audit*' | grep .
      - run: npm ci
      - name: Source check (including canonical Roman style)
        run: npm run source:check
      - name: Astro and TypeScript
        run: npm run check
      - name: Build, unit tests and source checks
        run: npm run build
      - name: Critical browser journeys
        run: npm run test:smoke
