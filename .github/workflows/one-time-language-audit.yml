name: One-time language editorial audit
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
permissions:
  contents: write
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[language-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Record the five reviewed language editions in the existing tracker
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("audit/manual-md-review-tracker.csv")
          with path.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              cols = reader.fieldnames
              rows = [dict(row) for row in reader]
          assert {"path", "notes", "metadata_pass", "roman_transliteration_pass"} <= set(cols)
          assert len(rows) == len({row["path"] for row in rows})
          by_path = {row["path"]: row for row in rows}
          files = {
            "abbas-alamdar-balti.md": ("partial_review","reviewed",
              "2026-11-15: manually transcribed the complete four numbered Balti stanzas and refrain to Roman while preserving the source script. Native Balti speaker/audio verification of vowels remains necessary; not Roman Urdu."),
            "uth-nana-mere-dard-wandaa-main-veer-kuha-k-ai-han.md": ("partial_review","reviewed",
              "2026-11-15: manually separated five Roman Panjabi stanzas into three verses each; corrected actual language=Panjabi/lang=pa while preserving noUrdu. Punjabi phonetic ambiguities await native speaker/audio review."),
            "heart-of-hussain.md": ("not_applicable","reviewed",
              "2026-11-15: original English (language=English/lang=en/direction=ltr), not Roman Urdu; no Roman transliteration is expected or required."),
            "karbala-karbala-english.md": ("not_applicable","reviewed",
              "2026-11-15: original English (language=English/lang=en/direction=ltr), not Roman Urdu; no Roman transliteration is expected or required."),
            "the-one-and-only-hussain.md": ("not_applicable","reviewed",
              "2026-11-15: original English (language=English/lang=en/direction=ltr), not Roman Urdu; no Roman transliteration is expected or required."),
          }
          for name, (roman, metadata, note) in files.items():
              key = "src/data/lyrics/" + name
              assert key in by_path, "Missing prior review tracker entry: " + key
              row = by_path[key]
              row["roman_transliteration_pass"] = roman
              row["metadata_pass"] = metadata
              before = row["notes"].strip()
              if note not in before:
                  row["notes"] = before + (" | " if before else "") + note
          with path.open("w",encoding="utf-8",newline="") as f:
              writer=csv.DictWriter(f,fieldnames=cols,lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          audit=Path("audit/import-merge-readiness.md")
          doc=audit.read_text("utf-8")
          anchor="## Metadata and stanza preparation\n"
          assert anchor in doc
          section=(
            "## Language-specific editions (2026-11-15)\n\n"
            "- Manually added four stanza-aligned Roman Balti blocks in `abbas-alamdar-balti.md`; original Balti untouched. Source pronunciations still require a native-speaker verification (partial review).\n"
            "- Manually reformatted the existing Roman-only Panjabi source `uth-nana-mere-dard-wandaa-main-veer-kuha-k-ai-han.md` to five numbered three-verse sections, corrected language to Panjabi/pa, and kept noUrdu. Uncertain original phonetics require source/audio review.\n"
            "- Confirmed `heart-of-hussain.md`, `karbala-karbala-english.md`, and `the-one-and-only-hussain.md` were already correctly marked English/en/ltr. No Roman Urdu edition is expected: English is now exempt from Roman Urdu source lint and normalization, without weakening generic text checks or adding noRoman tags.\n"
            "- The Roman Urdu normalizer now also leaves Balti and Panjabi native editions untouched. Readers distinguish English native originals, Latin-script Panjabi and two-script Balti without mislabelling English as Roman Urdu. Targeted tests use these five actual files.\n"
            "- The older unrelated full-corpus source-check blockers remain open.\n\n"
          )
          audit.write_text(doc.replace(anchor,section+anchor))
          print("Updated five existing tracker rows; total tracker records:",len(rows))
          PY
      - name: Check Astro, source IDs, Basta index, and full unit suite
        run: |
          npm ci
          npm run check
          npm test
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          node scripts/sync-basta-index.mjs --check
      - name: Clean up and commit audit
        run: |
          rm -f .github/workflows/one-time-language-audit.yml
          git add audit/manual-md-review-tracker.csv audit/import-merge-readiness.md .github/workflows/one-time-language-audit.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record manually reviewed language editions [skip ci]"
          git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05
