name: Validate Basta refrain rendering

on:
  push:
    branches:
      - fix/basta-refrain-source-markers-2026-10

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify OCR wrapper cleanup
        shell: bash
        run: |
          if grep -RinE '^\s*\[[[:space:]]*(ماخذ|مآخذ|مأخذ|Makhaz|Maakhaz)[[:space:]]*[:：]' src/data/basta/{pages,roman} --include='*.md'; then
            echo 'OCR wrappers still present'
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Remove temporary validation workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/basta-refrain-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Basta refrain build validation"
          git push
