name: Dedup branch verification
on:
  push:
    branches: [fix/main-content-dedup-2026-11-16]
    paths: [.github/workflows/content-dedup-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Source and recitation identity checks
        run: npm run source:check
      - name: Production build, tests and indexing
        run: npm run build
      - name: Verify original cohort and recorded import purges
        run: |
          python3 - <<'PY'
          import csv,json,pathlib
          r=pathlib.Path('.')
          data=list(csv.DictReader((r/'audit/lyric-md-rounds.csv').open()))
          original={x['path'].split('/')[-1][:-3] for x in data if x['round']=='original'}
          lock=json.loads((r/'src/data/recitation/identity-lock.json').read_text())
          protected={x['id'] for x in lock['lyrics']}
          assert len(original)==129, (len(original),129)
          assert original <= protected, sorted(original-protected)
          assert next(x['path'] for x in lock['lyrics'] if x['id']=='shareek-e-dawat-e-islam-hain-abu-talib')=='shareeke-dawate-islam.md'
          print('All 129 protected IDs retained; migrated original path correct.')
          PY
