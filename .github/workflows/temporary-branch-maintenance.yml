name: Temporary dependency and source synchronization
on:
  push:
    branches:
      - chore/resolve-astro-check-hints-2026-11-02
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/resolve-astro-check-hints-2026-11-02
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Upgrade every direct production dependency to latest stable
        run: |
          npm install --save \
            @astrojs/sitemap@latest \
            @fontsource/amiri@latest \
            @fontsource/gulzar@latest \
            @fontsource/lateef@latest \
            @fontsource/lora@latest \
            @fontsource/markazi-text@latest \
            @fontsource/merriweather@latest \
            @fontsource/noto-naskh-arabic@latest \
            @fontsource/noto-nastaliq-urdu@latest \
            @fontsource/noto-sans-arabic@latest \
            @fontsource/open-sans@latest \
            @fontsource/scheherazade-new@latest \
            @fontsource/source-sans-3@latest \
            astro@latest
      - name: Upgrade developer dependencies to latest stable
        run: |
          npm install --save-dev \
            @astrojs/check@latest \
            pagefind@latest \
            typescript@^6.0.3 \
            wrangler@latest
          npm install --save-dev --save-exact @playwright/test@latest
      - name: Apply safe transitive security updates
        run: npm audit fix
      - name: Sync index labels and permanent recitation IDs
        shell: bash
        run: |
          set +e
          npm run basta:index:sync 2>&1 | tee /tmp/basta-index-sync.log
          index_status=${PIPESTATUS[0]}
          npm run recitation:ids:sync 2>&1 | tee /tmp/recitation-ids-sync.log
          identity_status=${PIPESTATUS[0]}
          echo "INDEX_STATUS=$index_status" >> "$GITHUB_ENV"
          echo "IDENTITY_STATUS=$identity_status" >> "$GITHUB_ENV"
          echo "Index exit: $index_status; identity exit: $identity_status" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit generated dependency, index and ID updates to this branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/data/basta/index.json src/data/recitation/identity-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh dependency lockfile, Basta index and source IDs'
            git push origin HEAD:chore/resolve-astro-check-hints-2026-11-02
          fi
      - name: Validate clean install, audit, and all project checks
        shell: bash
        run: |
          set +e
          fail=0
          for command in 'npm ci' 'npm audit' 'npm run basta:index:check' 'npm run recitation:ids:check' 'npm run check' 'npm test' 'npm run build'; do
            echo "::group::$command"
            bash -lc "$command" 2>&1 | tee -a validation-output.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "$command : $rc" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then fail=1; fi
          done
          if [ "${INDEX_STATUS:-1}" -ne 0 ] || [ "${IDENTITY_STATUS:-1}" -ne 0 ]; then fail=1; fi
          exit "$fail"
      - name: Upload validation output even on failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-validation-logs
          path: validation-output.log
          if-no-files-found: ignore
          retention-days: 7
