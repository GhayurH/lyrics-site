name: Round2 explicit-language reconciliation (one time)
# Read-only corpus audit; no lyric text edits or CI build.
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths: [.github/workflows/round2-language-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/audit-round2-language-codes.mjs
      - run: node --test tests/round2-explicit-language-fix.test.mjs
      - name: Reclassify explicitly identified Punjabi and Saraiki sources
        run: node scripts/round2-explicit-language-fix.mjs --write
      - name: Verify idempotence and patch integrity
        run: |
          node scripts/round2-explicit-language-fix.mjs --check
          git diff --check
      - name: Commit source language metadata only
        run: |
          git add -- src/data/lyrics
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: classify explicit Punjabi and Saraiki originals [skip ci]"
            git push origin HEAD:round2-kalams-2026-11-14
          fi