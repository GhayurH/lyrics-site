name: One-time Ana Ali Yabnul editorial reconciliation
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
permissions:
  contents: write
jobs:
  reconcile:
    if: contains(github.event.head_commit.message, '[verify-ana-ali-reconciliation]')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Preserve review history and record exact source decision
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path("audit/manual-md-review-tracker.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as f:
              rdr = csv.DictReader(f)
              columns = rdr.fieldnames
              rows = [dict(r) for r in rdr]
          required = {"path","stanza_alignment_pass","roman_transliteration_pass","urdu_completeness_pass","notes"}
          assert columns and required <= set(columns)
          assert len(rows) == len({r["path"] for r in rows})
          match = [r for r in rows if r["path"] == "src/data/lyrics/ana-ali-yabnul.md"]
          assert len(match) == 1
          row = match[0]
          row["stanza_alignment_pass"] = "reviewed"
          row["roman_transliteration_pass"] = "partial_review"
          row["urdu_completeness_pass"] = "partial_review"
          note = (
              "2026-11-15: manually reconciled 57 Roman/46 Urdu physical verse "
              "lines into 49 each. Removed six redundant Roman lines repeated "
              "from later stanzas (one hum/ham spelling variant), consolidated "
              "two repeated Arabic rajaz boundary lines, retained all 46 "
              "existing Urdu substantive verses, and retained three genuinely "
              "additional Roman Arabic rajaz lines with a newly transcribed "
              "Arabic-script counterpart. Restored identical nine numbered "
              "four-/six-verse stanza groups in both scripts, separate from "
              "four-line preamble and seven-line opening rajaz. Original Arabic "
              "rajaz pronunciation is still partial_review: nohayonline id=802 "
              "preserves the baseline text; supplementary ziyaraat/2013 Roman "
              "source retains variant Arabic wording; authoritative recorded "
              "reading should confirm the three restored lines."
          )
          existing = row["notes"].strip()
          if note not in existing:
              row["notes"] = existing + (" | " if existing else "") + note
          with path.open("w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=columns, lineterminator="\n")
              w.writeheader()
              w.writerows(rows)

          audit = Path("audit/import-merge-readiness.md")
          original = audit.read_text("utf-8")
          anchor = "## Metadata and stanza preparation\n"
          assert anchor in original
          heading = "## Ana Ali Yabnul manual source reconciliation (2026-11-15)\n\n"
          section = (
              "- Removed the unused @@toolbar@@ locator in @@tests/browser/recitation.spec.mjs@@ "
              "so Astro/TypeScript no longer reports its ts(6133) hint.\n"
              "- @@ana-ali-yabnul.md@@ previously had **57 Roman versus 46 Urdu physical verse lines**. "
              "The Roman stream included six repeated lines already present in the matching stanzas, "
              "and a separate repeat of the Arabic opening chant that enclosed three source-only "
              "Arabic rajaz lines. Preserved the three *unique* lines and manually transcribed "
              "their Arabic-script counterparts instead of discarding unique material.\n"
              "- Both editions now have **49 verse lines**, with equivalent preamble/intro blocks "
              "of four and seven lines and **nine identically numbered stanzas** "
              "(4, 4, 4, 6, 4, 4, 4, 4, 4 lines). "
              "All preexisting 46 Urdu verse lines and all non-duplicate Roman lines are retained. "
              "Source differences were compared to the NoHayOnline poem and the supplemental "
              "2013 Roman source; the three restored Arabic lines require a further recitation "
              "or native-language spelling check, so transliteration and Urdu completeness "
              "remain @@partial_review@@ rather than claiming verified wording.\n"
              "- Updated the existing manual tracker without creating a new status register; "
              "added a source-aware structural regression test while keeping the unchanged "
              "original recitation identity.\n\n"
          )
          section = section.replace("@@", chr(96))
          assert heading not in original
          audit.write_text(original.replace(anchor, heading + section + anchor), "utf-8")
          print("Updated one existing tracker row of", len(rows), "and the current-state merge audit.")
          PY
      - name: Check Astro hints, all unit tests, and stable source identities
        shell: bash
        run: |
          npm ci
          npm run check 2>&1 | tee /tmp/astro-check.log
          if grep -E -q '(ts\(6133\)|[1-9][0-9]* hints?)' /tmp/astro-check.log; then
            echo "Astro still reported a hint"
            exit 1
          fi
          npm test
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          node scripts/sync-basta-index.mjs --check
          git diff --check
      - name: Commit audit and delete one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-ana-ali-reconciliation.yml
          git add -A audit/manual-md-review-tracker.csv audit/import-merge-readiness.md .github/workflows/one-time-ana-ali-reconciliation.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record source-backed Ana Ali Yabnul alignment and clean Astro hint [skip ci]"
          git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05
