name: Temporary punctuation spacing audit
on:
  push:
    branches: [fix/urdu-font-sizing-and-yeh-normalization]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/one-off-punctuation-audit.mjs
