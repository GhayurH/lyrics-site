name: One-time Panjabi Shahmukhi publication check
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
permissions:
  contents: write
jobs:
  check:
    if: contains(github.event.head_commit.message, '[verify-shahmukhi]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Update the existing editorial tracker and current-state merge audit
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          file_name = "uth-nana-mere-dard-wandaa-main-veer-kuha-k-ai-han.md"
          path_key = "src/data/lyrics/" + file_name
          tracker = Path("audit/manual-md-review-tracker.csv")
          original = tracker.read_text(encoding="utf-8")
          bom = original.startswith("\ufeff")
          with tracker.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              cols = reader.fieldnames
              rows = [dict(r) for r in reader]
          assert cols and {"path","notes","roman_transliteration_pass","urdu_completeness_pass",
                           "stanza_alignment_pass","metadata_pass"} <= set(cols)
          assert len(rows) == len({row["path"] for row in rows})
          row = next(r for r in rows if r["path"] == path_key)
          row["roman_transliteration_pass"] = "partial_review"
          row["urdu_completeness_pass"] = "partial_review"
          row["stanza_alignment_pass"] = "reviewed"
          row["metadata_pass"] = "reviewed"
          note = ("2026-11-15: manually transcribed complete 5-stanza Panjabi Shahmukhi "
                  "edition (opening couplet + 15 numbered verse lines, Persian "
                  "stanza digits), moved existing Roman text unchanged into "
                  "romanLyrics, added Shahmukhi title and Roman alternateTitle, "
                  "set direction=rtl and removed obsolete noUrdu tag. Both editions "
                  "physically aligned (17 text lines each). Source-only phrases "
                  "such as oh tod and jhinkan remain phonetic/uncertain and require "
                  "native-speaker or audio verification; no invented repairs.")
          if note not in row["notes"]:
              row["notes"] = row["notes"].strip() + (" | " if row["notes"].strip() else "") + note
          with tracker.open("w", encoding="utf-8-sig" if bom else "utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=cols, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          audit = Path("audit/import-merge-readiness.md")
          text = audit.read_text(encoding="utf-8")
          old = ("- Manually reformatted the existing Roman-only Panjabi source "
                 "@@uth-nana-mere-dard-wandaa-main-veer-kuha-k-ai-han.md@@ to five "
                 "numbered three-verse sections, corrected language to Panjabi/pa, "
                 "and kept noUrdu. Uncertain original phonetics require source/audio review.")
          new = ("- Manually wrote the complete **Shahmukhi Panjabi** edition of "
                 "@@uth-nana-mere-dard-wandaa-main-veer-kuha-k-ai-han.md@@ "
                 "(opening couplet and five numbered triplets). The previous Roman "
                 "text is preserved unchanged under @@romanLyrics@@ and the script "
                 "editions align line by line. Language remains Panjabi/pa, "
                 "direction is now rtl, and the obsolete noUrdu tag was removed. "
                 "Uncertain phonetic source words remain partial_review pending "
                 "speaker/audio verification.")
          old2 = ("Readers distinguish English native originals, Latin-script "
                  "Panjabi and two-script Balti without mislabelling English as Roman Urdu.")
          new2 = ("Readers distinguish English native originals and bilingual "
                  "Shahmukhi/Roman Panjabi and Balti without mislabelling English as Roman Urdu.")
          old, new, old2, new2 = [
              x.replace("@@", chr(96)) for x in (old, new, old2, new2)
          ]
          assert old in text and old2 in text, "Audit text drifted"
          audit.write_text(text.replace(old,new).replace(old2,new2), encoding="utf-8")
          print("Updated one existing tracker row of", len(rows), "and the merge audit.")
          PY
      - name: Test aligned Shahmukhi and Roman editions and source identities
        shell: bash
        run: |
          npm ci
          npm run check
          npm test
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          node scripts/sync-basta-index.mjs --check
      - name: Commit the reviewed audit without retaining one-time CI files
        shell: bash
        run: |
          rm -f .github/workflows/one-time-panjabi-shahmukhi.yml
          git add -A audit/manual-md-review-tracker.csv audit/import-merge-readiness.md .github/workflows/one-time-panjabi-shahmukhi.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Audit manually transcribed Shahmukhi Panjabi bilingual source [skip ci]"
          git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05
