name: One-time dependency refresh
on:
  push:
    branches: [feat/about-complete-guide-2026-11-17]
    paths: [.github/workflows/refresh-dependencies.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install current npm
        run: npm install --global npm@12.2.2
      - name: Update every direct dependency to its latest stable release
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [name, previous] of Object.entries(pkg[section] ?? {})) {
              const latest = execFileSync('npm', ['view', name, 'dist-tags.latest'], { encoding: 'utf8' }).trim();
              if (!/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(latest) || latest.includes('-')) {
                throw new Error(`Unexpected/nonstable dist-tag for ${name}: ${latest}`);
              }
              // Preserve exact Playwright pin to match its browser installation;
              // other dependencies continue to accept compatible patch releases.
              pkg[section][name] = name === '@playwright/test' ? latest : `^${latest}`;
              console.log(`${section}: ${name} ${previous} -> ${pkg[section][name]}`);
            }
          }
          pkg.packageManager = 'npm@12.2.2';
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Re-resolve all dependencies and apply available non-breaking audit patches
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
      - name: Audit and capture findings
        shell: bash
        run: |
          npm audit --json > dependency-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log('Audit vulnerability totals:', JSON.stringify(counts));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Dependency audit after refresh\n\n' +
            Object.entries(counts).map(([level, count]) => '- ' + level + ': ' + count).join('\n') + '\n');
          NODE
      - name: Verify Astro and production build
        shell: bash
        run: |
          npm run check
          npm run build
      - name: Commit refreshed dependencies to this branch
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/refresh-dependencies.yml
          # Keep just the updated manifest and lockfile; no one-time workflow
          # or machine-specific audit report should remain in the branch.
          git add package.json package-lock.json .github/workflows/refresh-dependencies.yml
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh npm dependencies and security fixes [skip ci]'
          git push origin HEAD:feat/about-complete-guide-2026-11-17
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-after-refresh
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
