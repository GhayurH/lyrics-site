name: One-time Roman corpus standards audit
# Recheck post-migration sources, metadata and residual exceptions.
on:
  push:
    branches: [feat/roman-transliteration-standard-2026-11-04]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Audit all Roman sources without changing files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const roots=['src/data/lyrics','src/data/basta/pages'];
          const files=(await Promise.all(roots.map(async root=> (await fs.readdir(root)).filter(p=>p.endsWith('.md')).map(p=>root+'/'+p)))).flat();
          const cases=new Map(), words=new Map(), totals={files:0,withRoman:0,aligned:0,romanLines:0,unmatched:0,englishAppendices:0};
          const add=(code,path,line,roman,urdu='',limit=80)=>{
            const item=cases.get(code)||{count:0,files:new Set(),examples:[]};
            item.count++;item.files.add(path);
            if(item.examples.length<limit)item.examples.push({path,line,roman:roman.trim().slice(0,160),urdu:urdu.trim().slice(0,160)});
            cases.set(code,item);
          };
          const wordsFrom=s=>s.match(/[\p{Script=Arabic}\p{M}\u200c]+/gu)||[];
          const romanWords=s=>s.match(/[A-Za-zṅṄ]+(?:-[A-Za-zṅṄ]+)*/gu)||[];
          for(const file of files){
            const doc=await fs.readFile(file,'utf8');
            const match=/^---\n([\s\S]*?)\n---(?:\n|$)/u.exec(doc);if(!match){add('missing-frontmatter',file,1,'');continue}
            totals.files++;
            if(/^contentKind:\s*english-appendix\s*$/mu.test(match[1])){totals.englishAppendices++;continue}
            const h=match[1].split('\n');const start=h.findIndex(x=>/^romanLyrics:\s*\|-?\s*$/u.test(x));
            if(start<0){if(file.includes('/lyrics/'))add('standalone-roman-missing',file,1,'');continue}
            totals.withRoman++;
            let end=start+1;while(end<h.length&&(!h[end].trim()||h[end].startsWith('  ')))end++;
            const r=h.slice(start+1,end).map(s=>s.startsWith('  ')?s.slice(2):s);
            const body=doc.slice(match[0].length).split('\n');
            const rr=r.map((s,i)=>({s,i})).filter(x=>x.s.trim()&&x.s.trim()!=='---***---');
            const uu=body.map((s,i)=>({s,i})).filter(x=>x.s.trim()&&x.s.trim()!=='---***---');
            totals.romanLines+=rr.length;
            if(rr.length!==uu.length){totals.unmatched++;add('physical-lines-mismatch',file,start+1,rr.length+'/'+uu.length);continue}
            totals.aligned++;
            const check=(s,u,n)=>{
              if(/\(x\d+\)/iu.test(s))add('legacy-x2',file,n,s,u);
              if(/<\/?u>/iu.test(s))add('legacy-underlining',file,n,s,u);
              if(/\b(?:hussain|hassan|kyun|kyuṅ)\b/iu.test(s))add('unapproved-names-or-kiun',file,n,s,u);
              if(/(?<![\p{L}])[A-Za-z]+-o-[A-Za-z]+/u.test(s))add('hyphenated-o',file,n,s,u);
              if(/(?<![\p{L}])be-[a-z]+/iu.test(s))add('negative-be-hyphen',file,n,s,u);
              if(/(?<![\p{L}])([A-Za-zṅ]+)-\1(?![\p{L}])/iu.test(s))add('repetition-hyphen',file,n,s,u);
              if(/['’ʿʾ]/u.test(s))add('roman-apostrophe-or-ayn',file,n,s,u,100);
          if(/kyun/iu.test(s))add('kyun-substring',file,n,s,u,50);
          if(/oo/iu.test(s))add('oo-spelling',file,n,s,u);
              if(/ee/iu.test(s))add('ee-spelling',file,n,s,u);
              if(/[āīūēḍṭṣḥʿʾńñãîôê]/iu.test(s)||/[\u0300-\u036f]/u.test(s))add('foreign-latin-diacritics',file,n,s,u);
              const us=wordsFrom(u),rs=romanWords(s);
              if(us.length===rs.length){
                for(let i=0;i<us.length;i++){
                  const w=us[i].normalize('NFC'),t=rs[i],k=w.replace(/[\u064b-\u065f\u0670]/gu,'');
                  if(k.endsWith('ں')&&/n$/iu.test(t)&&!/[ṅṄ]$/u.test(t))add('aligned-noon-ghunna-not-dotted',file,n,t,w,80);
                  if(k.endsWith('ن')&&/[ṅṄ]$/u.test(t))add('aligned-regular-noon-dotted',file,n,t,w,6);
                  if(k.endsWith('ے')&&/(?:ay|ey)$/iu.test(t))add('aligned-urdu-ye-roman-ay-ey',file,n,t,w,80);
                  if(k.includes('ڑ')&&/(?:[dD](?!h))/.test(t))add('aligned-urdu-reh-roman-d',file,n,t,w,80);
                  if(k==='اے'&& !/^Ae$/iu.test(t))add('aligned-urdu-ae-not-Ae',file,n,t,w,12);
                  if(/^[\p{Script=Arabic}\p{M}]+$/u.test(w)){
                    const key=w.normalize('NFKC').replace(/[\u064b-\u065f\u0670]/gu,'');
                    if(!words.has(key))words.set(key,new Map());
                    const map=words.get(key);const term=t.toLowerCase();
                    map.set(term,(map.get(term)||0)+1);
                  }
                }
              }else if(us.some(s=>s.includes('ں'))){
                if(/[ṅṄ]/u.test(s)===false)add('unaligned-no-dotted-n',file,n,s,u,40);
              }
            };
            for(let i=0;i<rr.length;i++)check(rr[i].s,uu[i].s,start+rr[i].i+2);
            const title=h.find(x=>x.startsWith('alternateTitle: '));
            if(title){
              const q=title.slice('alternateTitle: '.length);
              if(/(?:hussain|hassan|kyun|oo|ee)/iu.test(q))add('metadata-title-bad-spelling',file,1,q,h.find(x=>x.startsWith('title: '))||'');
              if(/(^|\s)(?:e|ay|aye)(?=\s)/iu.test(q) && /اے/u.test(h.find(x=>x.startsWith('title: '))||''))add('metadata-title-vocative-or-izafat-review',file,1,q,h.find(x=>x.startsWith('title: '))||'');
            }
          }
          const hist=[...words.entries()].filter(([u,v])=>[...v.values()].reduce((a,b)=>a+b,0)>=15&&v.size>=2).map(([u,vars])=>({urdu:u,n:[...vars.values()].reduce((a,b)=>a+b,0),variants:[...vars.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6)})).sort((a,b)=>b.n-a.n);
          console.log('## TOTALS '+JSON.stringify(totals));
          for(const [category,data]of [...cases.entries()].sort((a,b)=>b[1].count-a[1].count))console.log('## CATEGORY '+category+' count='+data.count+' files='+data.files.size+'\n'+JSON.stringify(data.examples));
          console.log('## FREQUENT URDU TO ROMAN VARIANTS '+JSON.stringify(hist.slice(0,55)));
          NODE
      - name: Preview normalized word-level changes without writing sources
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { normalizeRomanMarkdown } from './scripts/lib/roman-normalize.mjs';
          const sources=(await Promise.all(['src/data/lyrics','src/data/basta/pages'].map(async dir=>(await readdir(dir)).filter(x=>x.endsWith('.md')).map(x=>dir+'/'+x)))).flat();
          const changes=[],categories={onlyN:0,retroflex:0,ye:0,mixed:0},samples=[];
          for(const path of sources){
            const prior=await readFile(path,'utf8');let next=prior,rounds=0;
            while(rounds++<8){const r=normalizeRomanMarkdown(next,path);if(!r.changed)break;next=r.text}
            if(next===prior)continue;changes.push(path);
            const a=prior.split('\n'),b=next.split('\n');
            for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i]){
              const old=a[i]||'',now=b[i]||'';
              const onlyN=old.replaceAll('n','ṅ')===now || old.replaceAll('N','Ṅ')===now;
              const type=onlyN?'onlyN': (/[dD]/.test(old)&&/[rR]/.test(now)&&old.length===now.length?'retroflex':(/[ye]/i.test(old)&&old.length>now.length?'ye':'mixed'));
              categories[type]++;
              if(samples.length<100 && (samples.length<50|| type!=='onlyN'))samples.push({path,line:i+1,old,now});
            }
          }
          console.log('## NORMALIZER DRY RUN '+JSON.stringify({filesChanged:changes.length,categories,samples}));
          NODE
