name: Finish dependency lockfile reconciliation
on:
  push:
    branches: [feat/about-complete-guide-2026-11-17]
    paths: [.github/workflows/reconcile-dependencies.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use npm 12
        run: npm install -g npm@12.2.2
      - name: Regenerate lockfile with compatible TypeScript
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Capture residual vulnerability summary
        run: |
          npm audit --json > dependency-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          const vulnerabilities = Object.entries(audit.vulnerabilities ?? {});
          const unresolved = vulnerabilities.map(([name, item]) => ({name, severity:item.severity, isDirect:item.isDirect, via:item.via.filter(v => typeof v === 'object').map(v => v.name)}));
          console.log(JSON.stringify({counts, unresolved}, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Dependency audit\n\n' +
            Object.entries(counts).map(([level, count]) => '- ' + level + ': ' + count).join('\n') + '\n');
          NODE
      - name: Validate project
        run: |
          npm run check
          npm run build
      - name: Commit lockfile and remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/reconcile-dependencies.yml
          git add package.json package-lock.json .github/workflows/reconcile-dependencies.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconcile lockfile with TypeScript 6 and current Wrangler [skip ci]'
          git push origin HEAD:feat/about-complete-guide-2026-11-17
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: about-branch-dependency-audit
          path: dependency-audit.json
          retention-days: 7
          if-no-files-found: ignore
