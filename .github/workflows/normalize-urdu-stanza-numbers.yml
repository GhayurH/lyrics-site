name: Normalize standalone Urdu stanza numbers

on:
  push:
    branches:
      - fix/basta-refrain-source-markers-2026-10

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only standalone stanza digits in Urdu markdown bodies
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root = "src/data/lyrics";
          const latin = "0123456789";
          const arabic = "٠١٢٣٤٥٦٧٨٩";
          const urdu = "۰۱۲۳۴۵۶۷۸۹";
          const toUrdu = (s) => [...s].map(c => {
            const index = latin.indexOf(c) >= 0 ? latin.indexOf(c) : arabic.indexOf(c);
            return index >= 0 ? urdu[index] : c;
          }).join("");
          let changedFiles = 0, changedNumbers = 0, examined = 0;
          for (const file of fs.readdirSync(root).filter(f => f.endsWith(".md"))) {
            const pathname = path.join(root, file);
            const original = fs.readFileSync(pathname, "utf8");
            const match = original.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n/);
            if (!match) throw Error("Missing YAML frontmatter: " + file);
            const frontmatter = match[0];
            if (!/^lang:\s*["']?ur["']?\s*$/m.test(frontmatter)) continue;
            examined++;
            const body = original.slice(frontmatter.length);
            const converted = body.replace(/^([ \t]*)([0-9٠-٩]+)([.)۔-]?)([ \t]*)$/gm, (_, leading, number, punctuation, trailing) => {
              const normalized = toUrdu(number);
              if (normalized !== number) changedNumbers++;
              return leading + normalized + punctuation + trailing;
            });
            if (body !== converted) {
              fs.writeFileSync(pathname, frontmatter + converted);
              changedFiles++;
            }
          }
          if (!changedNumbers) throw Error("Expected to find non-Urdu stanza numerals in lyric bodies");
          console.log("Examined Urdu files: " + examined + "; changed files: " + changedFiles + "; stanza numbers converted: " + changedNumbers);
          NODE
      - name: Remove temporary workflow and commit normalized markdown
        run: |
          git rm .github/workflows/normalize-urdu-stanza-numbers.yml
          git add src/data/lyrics
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Urdu stanza numerals in non-Basta Markdown"
          git push
