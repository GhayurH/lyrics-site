name: Reader validation
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    # Pinned to @playwright/test in package.json. Chromium and its Linux
    # dependencies are already present; avoid an apt/browser install per run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The checkout action owns .git as root; container commands run as
      # pwuser, so scope Git's trust exception to this checkout only.
      - run: git -c safe.directory="$GITHUB_WORKSPACE" diff --check origin/main...HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Prebuild executes Node tests and recitation identity checks on each push.
      # Mark a milestone commit [full-ci] to run the complete browser suite.
      - id: test_mode
        shell: bash
        run: |
          if { git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD; git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD^2 2>/dev/null || true; } | grep -Fq '[full-ci]'; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
          if git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD | grep -Fq '[visual-ci]'; then
            echo 'visual=true' >> "$GITHUB_OUTPUT"
          else
            echo 'visual=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - name: Audit Basta page boundaries
        if: steps.test_mode.outputs.full == 'true' || github.ref == 'refs/heads/main'
        run: npm run basta:kalams:audit
      - name: Verify deployment asset redirects
        run: |
          test -f dist/_redirects
          grep -Fq '/images/* https://r2-assets.kalamarchive.com/images/:splat 302' dist/_redirects
          grep -Fq '/files/* https://r2-assets.kalamarchive.com/files/:splat 302' dist/_redirects
          test -f dist/_routes.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const routes=JSON.parse(readFileSync('dist/_routes.json','utf8')); for (const path of ['/api/recitation-sets','/api/recitation-sets/*','/r/*']) if (!routes.include.includes(path)) throw Error('Missing Pages Function route: '+path); if (routes.include.includes('/*')) throw Error('Unexpected all-static Function invocation');"
      - name: Browser regression suite (milestones only)
        if: steps.test_mode.outputs.full == 'true' || steps.test_mode.outputs.visual == 'true' || github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.test_mode.outputs.visual }}" = "true" ]; then
            npx playwright test
          else
            npx playwright test --grep '@smoke'
          fi
      - name: Save representative responsive captures
        if: always() && steps.test_mode.outputs.visual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-clarity-viewports
          path: test-results/visual-review/
          if-no-files-found: ignore
          retention-days: 7
