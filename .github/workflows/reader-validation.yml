name: Reader validation
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
concurrency:
  group: reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    # Pinned to @playwright/test in package.json. Chromium and its Linux
    # dependencies are already present; avoid an apt/browser install per run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The checkout action owns .git as root; container commands run as
      # pwuser, so scope Git's trust exception to this checkout only.
      - name: Check patch whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git -c safe.directory="$GITHUB_WORKSPACE" diff --check origin/main...HEAD
          else
            git -c safe.directory="$GITHUB_WORKSPACE" diff --check HEAD^ HEAD
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Production builds always run Node tests and identity checks. Browser
      # smoke covers every PR/main push; reserve the wider matrix for weekly
      # checks, manual runs, or an explicit [full-ci] commit marker.
      - id: test_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only origin/main...HEAD)"
          else
            changed="$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only HEAD^ HEAD)"
          fi
          # PR checkouts are synthetic merge commits; their second parent is
          # the proposed branch head. For pushes, inspect only the current
          # commit so PR opt-in markers do not leak into main's next run.
          messages="$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            messages="$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD^2)"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || grep -Fq '[full-ci]' <<< "$messages"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
          # Astro diagnostics need a fresh optional install; avoid that work
          # for pure CSS, Markdown, content, or test-only revisions.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             grep -Eq '\.(astro|tsx?|jsx?)$' <<< "$changed" || grep -Fq '[check-ci]' <<< "$messages"; then
            echo 'check=true' >> "$GITHUB_OUTPUT"
          else
            echo 'check=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Astro and TypeScript semantics
        if: steps.test_mode.outputs.check == 'true'
        run: npm run check
      - run: npm run build
      - name: Report JavaScript, CSS, and font asset sizes
        run: npm run perf:assets
      - name: Generate source review queue (Basta and standalone)
        if: steps.test_mode.outputs.full == 'true'
        run: |
          npm run --silent content:review -- --markdown > content-review.md
          npm run --silent content:review -- --csv > content-review.csv
          grep '^Audited ' content-review.md
      - name: Save editorial review queue
        if: steps.test_mode.outputs.full == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: content-review
          path: |
            content-review.md
            content-review.csv
          retention-days: 14
      - name: Verify deployment asset redirects
        run: |
          test -f dist/_redirects
          grep -Fq '/images/* https://r2-assets.kalamarchive.com/images/:splat 302' dist/_redirects
          grep -Fq '/files/* https://r2-assets.kalamarchive.com/files/:splat 302' dist/_redirects
          test -f dist/_routes.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const routes=JSON.parse(readFileSync('dist/_routes.json','utf8')); for (const path of ['/api/recitation-sets','/api/recitation-sets/*','/r/*']) if (!routes.include.includes(path)) throw Error('Missing Pages Function route: '+path); if (routes.include.includes('/*')) throw Error('Unexpected all-static Function invocation');"
      - name: Browser regression suite (smoke or full)
        # Every PR/main build runs smoke; weekly/manual/opt-in checks run full.
        run: |
          if [ "${{ steps.test_mode.outputs.full }}" = "true" ]; then
            npm run test:browser
          else
            npm run test:smoke
          fi
      - name: Save failing browser screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reader-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  dependency_research:
    permissions:
      contents: write
    # Temporary audited upgrade run. Produces a reproducible npm lockfile
    # without giving an unreviewed update process write access to the repo.
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/test-suite-lean-2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Resolve current stable dependencies and lockfile
        shell: bash
        run: |
          npx --yes npm-check-updates@latest -u
          npm install --save-dev @astrojs/check@latest typescript@6.0.3
          npm pkg set 'scripts.check=astro check'
          npm install
          node -e "const fs=require('fs');const f='package.json',p=JSON.parse(fs.readFileSync(f));const l=JSON.parse(fs.readFileSync('package-lock.json')); const v=l.packages['node_modules/esbuild']?.version;if(!v)throw Error('esbuild missing'); p.allowScripts={'esbuild@'+v:true};fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')"
          npm ls --depth=0
          npm outdated || true
          npm audit --json > dependency-audit.json || true
          node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"
      - name: Commit upgraded package manifest and lockfile to current PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade npm dependencies and lockfile"
          git push origin HEAD:${{ github.head_ref }}
      - name: Export proposed package files
        uses: actions/upload-artifact@v6
        with:
          name: npm-upgrade-proposal
          path: |
            package.json
            package-lock.json
            dependency-audit.json
          retention-days: 2
