name: Reader validation
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git diff --check origin/main...HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run recitation:ids:bootstrap -- --part=0
      - run: npm run recitation:ids:bootstrap -- --part=1
      - run: npm run recitation:ids:bootstrap -- --part=2
      - run: npm run recitation:ids:bootstrap -- --part=3
      # Catalog verification is informative until every exceptional printed-page boundary is reviewed.
      - run: npm run basta:kalams:audit
      # The prebuild hook already runs npm test; do not run the suite twice.
      - run: npm run build
      - name: Verify deployment asset redirects
        run: |
          test -f dist/_redirects
          grep -Fq '/images/* https://r2-assets.kalamarchive.com/images/:splat 302' dist/_redirects
          grep -Fq '/files/* https://r2-assets.kalamarchive.com/files/:splat 302' dist/_redirects
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
