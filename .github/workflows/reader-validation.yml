name: Reader validation
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 0'
concurrency:
  group: reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    # Pinned to @playwright/test in package.json. Chromium and its Linux
    # dependencies are already present; avoid an apt/browser install per run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The checkout action owns .git as root; container commands run as
      # pwuser, so scope Git's trust exception to this checkout only.
      - run: git -c safe.directory="$GITHUB_WORKSPACE" diff --check origin/main...HEAD
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Every build runs Node tests and stable-ID checks through prebuild.
      # Ordinary PR updates skip browsers. Explicit commit markers control
      # milestones; main always receives at least a browser smoke pass.
      - id: test_mode
        shell: bash
        run: |
          messages="$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD;
            git -c safe.directory="$GITHUB_WORKSPACE" log -1 --pretty=%B HEAD^2 2>/dev/null || true)"
          # Shared reader, styles, recitation server/client, and browser test changes
          # require complete Chromium coverage even without a commit marker.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git -c safe.directory="$GITHUB_WORKSPACE" diff --name-only origin/main...HEAD)"
          else
            changed="$(git -c safe.directory="$GITHUB_WORKSPACE" diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          if grep -Eq '^(src/(client|components|styles|lib|layouts)/|functions/|tests/browser/|package(-lock)?\.json|playwright\.config)' <<< "$changed" || \
             [ "${{ github.event_name }}" = "schedule" ] || grep -Fq '[full-ci]' <<< "$messages"; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Fq '[smoke-ci]' <<< "$messages"; then
            echo 'smoke=true' >> "$GITHUB_OUTPUT"
          else
            echo 'smoke=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
      - name: Audit Basta page boundaries
        if: steps.test_mode.outputs.full == 'true' || github.ref == 'refs/heads/main'
        run: npm run basta:kalams:audit
      - name: Verify deployment asset redirects
        run: |
          test -f dist/_redirects
          grep -Fq '/images/* https://r2-assets.kalamarchive.com/images/:splat 302' dist/_redirects
          grep -Fq '/files/* https://r2-assets.kalamarchive.com/files/:splat 302' dist/_redirects
          test -f dist/_routes.json
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const routes=JSON.parse(readFileSync('dist/_routes.json','utf8')); for (const path of ['/api/recitation-sets','/api/recitation-sets/*','/r/*']) if (!routes.include.includes(path)) throw Error('Missing Pages Function route: '+path); if (routes.include.includes('/*')) throw Error('Unexpected all-static Function invocation');"
      - name: Browser regression suite (selected checks)
        if: steps.test_mode.outputs.smoke == 'true' || steps.test_mode.outputs.full == 'true' || github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.test_mode.outputs.full }}" = "true" ]; then
            npm run test:browser
          else
            npm run test:smoke
          fi
      - name: Save failing browser screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
