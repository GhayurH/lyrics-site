name: One-time Round 2 isolated Codex preflight
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths:
      - scripts/kalam_codex_isolation.py
      - tests/test_kalam_codex_worker.py
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'GhayurH/lyrics-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Codex scripts
        run: |
          python3 -m py_compile scripts/kalam_codex.py scripts/kalam_codex_isolation.py scripts/kalam_codex_worker.py scripts/kalam_codex_quality.py
      - name: Run isolated worker, quota, watchdog, and transliteration tests
        run: python3 -m unittest discover -s tests -p 'test_kalam_codex*.py' -v
      - name: Read-only service preview and progress
        run: |
          python3 scripts/kalam_codex.py plan --limit 0
          python3 scripts/kalam_codex.py status --json
          git diff --check
