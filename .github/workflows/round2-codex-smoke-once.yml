name: One-time Round 2 Codex CLI smoke test
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths: [scripts/kalam_codex.py]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round2-kalams-2026-11-14
          fetch-depth: 0
          persist-credentials: true
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p test_kalam_codex.py -v
      - name: Safe CLI inventory
        run: python3 scripts/kalam_codex.py plan --limit 0
      - name: Check CLI help
        run: python3 scripts/kalam_codex.py run --help
      - name: Remove temporary smoke workflow after passing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/round2-codex-smoke-once.yml
          git commit -m 'chore: finish Round 2 Codex CLI smoke checks [skip ci]'
          git push origin HEAD:refs/heads/round2-kalams-2026-11-14
