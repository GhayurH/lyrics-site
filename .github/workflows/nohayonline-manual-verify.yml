name: Validate NoHayOnline manual stanza edits
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-manual-verify.yml]
permissions:
  contents: write
concurrency:
  group: nohayonline-manual-verify-2026-11-07
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Verify current manual edits against user baseline
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, yaml
          BASE='326dc47ef0547ca50bbb559bf098c375f72e95a9'
          files=subprocess.check_output(['git','diff','--name-only',BASE,'HEAD','--','src/data/lyrics'],text=True).splitlines()
          split=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          numbers=re.compile(r'^[0-9۰-۹٠-٩]+$')
          def read(raw):
              m=split.fullmatch(raw)
              if not m: raise AssertionError('bad YAML delimiters')
              front, body=m.groups()
              data=yaml.safe_load(front)
              if not isinstance(data,dict): raise AssertionError('bad YAML')
              return data,body,[x for x in front.splitlines() if re.match(r'^# (source_id|source_url|raw_sha256):',x)]
          def check_stream(t,urdu,path):
              digits='۰۱۲۳۴۵۶۷۸۹'
              groups=[[]]
              seq=[]
              for ln in t.splitlines():
                  s=ln.strip()
                  if numbers.fullmatch(s):
                      seq.append(s)
                      groups.append([])
                  elif s: groups[-1].append(s)
              expected=[str(i).translate(str.maketrans('0123456789',digits)) if urdu else str(i) for i in range(1,len(seq)+1)]
              if seq!=expected: raise AssertionError(f'{path} malformed numbering {seq} wanted {expected}')
              if not groups[0] or any(not g for g in groups[1:]): raise AssertionError(f'{path} empty preamble or stanza')
              if len(seq)==0: raise AssertionError(f'{path} no numbered stanzas')
              return len(seq),sum(map(len,groups))
          print('FILES',len(files))
          for filename in files:
              if not filename.endswith('.md'): continue
              orig=subprocess.check_output(['git','show',f'{BASE}:{filename}'],text=True)
              curr=pathlib.Path(filename).read_text()
              old,oldbody,oldcomments=read(orig)
              new,newbody,newcomments=read(curr)
              if '# source_id: nohayonline:' not in orig: raise AssertionError(f'{filename} unexpected non-NoHayOnline edit')
              if oldcomments!=newcomments: raise AssertionError(f'{filename} provenance changed')
              if old.get('published') is not False or new.get('published') is not False: raise AssertionError(f'{filename} publication state changed')
              if {k:v for k,v in old.items() if k!='romanLyrics'}!={k:v for k,v in new.items() if k!='romanLyrics'}: raise AssertionError(f'{filename} non-lyric metadata changed')
              roman=new.get('romanLyrics')
              if not isinstance(roman,str): raise AssertionError(f'{filename} missing Roman lyrics')
              rlen,_=check_stream(roman,False,filename+' Roman')
              ulen,_=check_stream(newbody,True,filename+' Urdu')
              if rlen!=ulen: raise AssertionError(f'{filename} Roman/Urdu stanza mismatch {rlen} {ulen}')
          print('VERIFIED',len(files),'manually corrected NoHayOnline files with proper Roman/Urdu structure and preserved metadata')
          PY
      - name: Check patch whitespace
        run: git diff --check 326dc47ef0547ca50bbb559bf098c375f72e95a9 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test and build without unrelated canonical-spelling gate
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
