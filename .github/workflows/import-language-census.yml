name: One-time import language and metadata census
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audit-lang]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enumerate values and schema risks
        run: |
          python3 - <<'PY'
          import collections, json, re
          from pathlib import Path
          records=collections.defaultdict(lambda:collections.defaultdict(list))
          for f in sorted(Path('src/data/lyrics').rglob('*.md')):
              txt=f.read_text(encoding='utf8')
              head=txt.split('\n---\n',1)[0]
              for key in ('language','lang','direction','occasion','haal','romanHaal','tags','kalamType','poet','reciter'):
                  m=re.search(r'^'+key+r':\s*(.*)$',head,re.M)
                  if m and m.group(1).strip():
                      value=m.group(1).strip().strip('\"')
                      records[key][value].append(f.name)
          for key in ('language','lang','direction','kalamType','occasion','haal','romanHaal','tags'):
              entries=sorted(records[key].items(),key=lambda x:(-len(x[1]),x[0]))
              print('CENSUS',key,'UNIQUE',len(entries))
              for v,files in entries[:130]:
                  print('VALUE',key,repr(v),'COUNT',len(files),'EXAMPLE',files[0])
          for key in ('poet','reciter'):
              entries=sorted(records[key].items(),key=lambda x:(-len(x[1]),x[0]))
              print('CENSUS',key,'UNIQUE',len(entries),'TOP',[(k,len(v)) for k,v in entries[:25]])
          PY
