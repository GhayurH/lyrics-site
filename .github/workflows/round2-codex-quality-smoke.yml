name: One-time Round 2 Codex quality smoke
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths:
      - scripts/kalam_codex_quality.py
      - tests/test_kalam_codex_quality.py
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'GhayurH/lyrics-site'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile Python modules
        run: python3 -m py_compile scripts/kalam_codex.py scripts/kalam_codex_worker.py scripts/kalam_codex_quality.py
      - name: Check new and legacy worker fixtures
        run: python3 -m unittest discover -s tests -p 'test_kalam_codex*.py' -v
      - name: Run read-only worker CLI smoke
        run: |
          python3 scripts/kalam_codex.py plan --limit 0
          python3 scripts/kalam_codex.py status --json
          python3 scripts/kalam_codex.py validate --help
          git diff --check
