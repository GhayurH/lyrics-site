name: Verify 52 additional NoHayOnline stanza repairs
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-stanza-batch-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Verify edited poems, metadata, line order, and stanza alignment
        run: |
          python - <<'PY'
          import collections
          import pathlib
          import re
          import subprocess
          import yaml
          
          base = '5a7c812b054d32e96b6209b840feaa46095b7118'
          changed = [p for p in subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD', '--', 'src/data/lyrics'],
              text=True
          ).splitlines() if p.endswith('.md')]
          assert len(changed) == 52, ('Wrong edit count', len(changed), changed)
          
          yaml_re = re.compile(r'\A---\n(.*?)\n---\n(.*)\Z', re.S)
          number_re = re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          abbreviated = re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          digit_map = str.maketrans('0123456789', '۰۱۲۳۴۵۶۷۸۹')
          totals = collections.Counter()
          
          def parse(raw):
              m = yaml_re.fullmatch(raw)
              assert m, 'Malformed frontmatter'
              front = yaml.safe_load(m[1])
              assert isinstance(front, dict)
              provenance = [s for s in m[1].splitlines()
                            if s.startswith(('# source_id:', '# source_url:', '# raw_sha256:'))]
              return front, m[2], provenance
          
          def pure_lines(s):
              return [v for line in s.splitlines()
                      if (v := line.strip()) and not number_re.fullmatch(v)]
          
          def compare_lines(before, after, path, script):
              old, new = pure_lines(before), pure_lines(after)
              oc, nc = collections.Counter(old), collections.Counter(new)
              assert not (nc - oc), (path, script, 'Added or changed substantive lines', nc-oc)
              removed = oc - nc
              norm = lambda s: re.sub(r'[.\u2026\u06d4\s]+', '', s).casefold()
              for line, count in removed.items():
                  assert abbreviated.search(line), (path, script, 'Removed a substantive line', line)
                  assert sum(n for s, n in oc.items() if norm(s) == norm(line)) >= 2, (
                      path, script, 'Removed an unrepeated shortened refrain', line)
              cursor = iter(old)
              for line in new:
                  assert any(v == line for v in cursor), (path, script, 'Changed original line order', line)
              return sum(removed.values())
          
          def split(t, is_urdu):
              groups, marks = [[]], []
              for line in t.splitlines():
                  val = line.strip()
                  if not val:
                      continue
                  if number_re.fullmatch(val):
                      marks.append(val)
                      groups.append([])
                  else:
                      groups[-1].append(val)
              expected = [str(n).translate(digit_map) if is_urdu else str(n)
                          for n in range(1, len(marks)+1)]
              assert marks == expected, ('Invalid stanza numbering', marks, expected)
              assert marks and all(groups), ('Empty opening or stanza', [len(g) for g in groups])
              return groups
          
          for path in changed:
              old = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
              new = pathlib.Path(path).read_text(encoding='utf-8')
              assert '# source_id: nohayonline:' in old, ('Wrong source', path)
              before, old_urdu, orig_comments = parse(old)
              after, new_urdu, new_comments = parse(new)
              assert before.get('published') is False and after.get('published') is False, (
                  'Unexpected published state', path)
              assert {k:v for k,v in before.items() if k != 'romanLyrics'} == {
                  k:v for k,v in after.items() if k != 'romanLyrics'}, ('Metadata modified', path)
              assert orig_comments == new_comments, ('Provenance comments modified', path)
              r0, r1 = before.get('romanLyrics'), after.get('romanLyrics')
              assert isinstance(r0, str) and isinstance(r1, str), ('Roman missing', path)
              totals['roman_refrains'] += compare_lines(r0, r1, path, 'Roman')
              totals['urdu_refrains'] += compare_lines(old_urdu, new_urdu, path, 'Urdu')
              R, U = split(r1, False), split(new_urdu, True)
              assert len(R) == len(U), ('Stanza count mismatch', path)
              assert [len(x) for x in R] == [len(x) for x in U], ('Stanza alignment mismatch', path)
              assert len(R[0]) >= 2, ('Opening too short', path)
              print(f'OK {path} | numbered={len(R)-1}, opening={len(R[0])}, lengths={[len(x) for x in R[1:]]}')
          
          print('VERIFIED', len(changed), 'NoHayOnline files;', dict(totals))
          PY
      - name: Verify patch whitespace
        run: git diff --check 5a7c812b054d32e96b6209b840feaa46095b7118 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Astro validation and build
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
