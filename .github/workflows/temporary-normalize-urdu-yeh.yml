name: Apply Urdu yeh cleanup (temporary)
on:
  push:
    branches:
      - fix/urdu-font-sizing-and-yeh-normalization
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Normalize source Markdown
        run: node scripts/normalize-urdu-yeh.mjs --write
      - name: Commit normalized content
        run: |
          if ! git diff --quiet -- src/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "Normalize Urdu yeh in Markdown content"
            git push
          fi
