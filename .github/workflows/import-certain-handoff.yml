name: Import warning-free consolidated lyrics

on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
    paths:
      - "handoff/inbox/index.json"

permissions:
  contents: write

concurrency:
  group: site-certain-import-2026-11-05
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frontmatter validator
        run: python -m pip install pyyaml
      - name: Validate shards and copy only new poems
        run: python .github/scripts/import_certain_handoff.py
      - name: Validate Astro content collection
        run: |
          npm ci
          npx astro check
      - name: Commit new unpublished poems and source receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/lyrics handoff
          if git diff --cached --quiet; then
            echo "No poems imported"
          else
            git commit -m "Import warning-free consolidated lyrics as unpublished"
            for attempt in 1 2 3; do
              git fetch origin feat/import-overlap-reconciliation-2026-11-05
              git rebase origin/feat/import-overlap-reconciliation-2026-11-05
              if git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Could not publish website Markdown handoff" >&2
                exit 1
              fi
            done
          fi
