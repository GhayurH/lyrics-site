name: Round2 source language tags (one time)
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths: [.github/workflows/round2-language-codes-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test migration
        run: node --test tests/language-codes-migration.test.mjs
      - name: Apply approved migration
        run: node scripts/one-time-language-codes.mjs --write
      - name: Confirm no pending tags and clean patch
        run: |
          node scripts/one-time-language-codes.mjs --check
          git diff --check
      - name: Commit one-time changes
        run: |
          git add -- src/data/lyrics
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: migrate round2 language tags [skip ci]"
            git push origin HEAD:round2-kalams-2026-11-14
          fi