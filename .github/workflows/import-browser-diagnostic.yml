name: One-time import production and full browser diagnostics
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[browser-diag]')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build production output (source gate separately reported)
        run: |
          npx astro build
          npx pagefind --site dist
          node scripts/generate-offline-search-manifest.mjs
      - name: Complete Playwright browser regressions
        run: npm run test:browser
      - name: Save regression artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: imported-lyrics-browser-diagnostic
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
