name: Validate 56 NoHayOnline editorial stanza corrections
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-editorial-batch-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Verify lyric preservation, metadata and stanza alignment
        run: |
          python - <<'PY'
          import collections,pathlib,re,subprocess,yaml
          base='8ef36d52a306cb1b42d8f65112f3583dff203cde'
          files=[p for p in subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines() if p.endswith('.md')]
          assert len(files)==56,('Unexpected edited file count',len(files),files)
          fm=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          num=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          shortened=re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          digits=str.maketrans('0123456789','۰۱۲۳۴۵۶۷۸۹')
          def parse(raw):
              m=fm.fullmatch(raw)
              assert m,'Malformed frontmatter'
              obj=yaml.safe_load(m[1])
              assert isinstance(obj,dict)
              provenance=[x for x in m[1].splitlines() if x.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
              return obj,m[2],provenance
          def flat(t):
              return [v for line in t.splitlines() if (v:=line.strip()) and not num.fullmatch(v)]
          def compare(before,after,path,language):
              old,new=flat(before),flat(after)
              bc,nc=collections.Counter(old),collections.Counter(new)
              assert not(nc-bc),(path,language,'Unexpected new/modified lyric lines',nc-bc)
              norm=lambda s:re.sub(r'[\s.۔…]+','',s.casefold())
              removed=bc-nc
              for line,count in removed.items():
                  assert shortened.search(line),(path,language,'Substantive line removed',line)
                  assert sum(v for t,v in bc.items() if norm(t)==norm(line))>=2,(
                      path,language,'Unique shortened line removed',line)
              old_iter=iter(old)
              for line in new:
                  assert any(x==line for x in old_iter),(path,language,'Line order changed',line)
              return sum(removed.values())
          def groups(t,urdu):
              g=[[]];markers=[]
              for line in t.splitlines():
                  x=line.strip()
                  if not x:continue
                  if num.fullmatch(x):markers.append(x);g.append([])
                  else:g[-1].append(x)
              expected=[str(i).translate(digits) if urdu else str(i) for i in range(1,len(markers)+1)]
              assert markers==expected,('Incorrect stanza numbering',markers,expected)
              assert markers and all(g),('Empty preamble or stanza',[len(x) for x in g])
              assert all(len(x)>=2 for x in g[1:]),'One-line numbered stanza needs review'
              return g
          counts=collections.Counter()
          for path in files:
              oldtext=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              newtext=pathlib.Path(path).read_text()
              assert '# source_id: nohayonline:' in oldtext,('Unexpected source',path)
              old,old_urdu,old_prov=parse(oldtext)
              new,new_urdu,new_prov=parse(newtext)
              assert old.get('published') is False and new.get('published') is False,('Publication changed',path)
              assert {k:v for k,v in old.items() if k!='romanLyrics'}=={k:v for k,v in new.items() if k!='romanLyrics'},('Metadata changed',path)
              assert old_prov==new_prov,('Source provenance changed',path)
              old_roman,new_roman=old.get('romanLyrics'),new.get('romanLyrics')
              assert isinstance(old_roman,str) and isinstance(new_roman,str),('Missing Roman text',path)
              counts['roman_shorthand']+=compare(old_roman,new_roman,path,'Roman')
              counts['urdu_shorthand']+=compare(old_urdu,new_urdu,path,'Urdu')
              R,U=groups(new_roman,False),groups(new_urdu,True)
              assert len(R)==len(U),(path,'Urdu and Roman stanza counts differ')
              assert [len(x) for x in R]==[len(x) for x in U],(path,'Urdu and Roman stanza boundaries differ')
              assert R[0]==groups(old_roman,False)[0] and U[0]==groups(old_urdu,True)[0],('Original opening changed',path)
              print('PASS',path,'stanzas',len(R)-1,'opening',len(R[0]))
          print('VERIFIED',len(files),'NoHayOnline lyrics;',dict(counts))
          PY
      - name: Verify whitespace
        run: git diff --check 8ef36d52a306cb1b42d8f65112f3583dff203cde HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Astro checks, tests, production build, search
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
