name: Final Basta refactor verification
on:
  push:
    branches:
      - fix/basta-refrain-source-markers-2026-10
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Inspect final readers and CSS structure
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import postcss from 'postcss';
          for (const page of ['dist/basta/200/index.html', 'dist/basta/139/index.html', 'dist/lyrics/aa-asghar-bin-tere/index.html']) {
            const html = fs.readFileSync(page,'utf8');
            assert.match(html,/poetry-stanza-number/);
            console.log('Circular numbers:',page);
          }
          const site = fs.readFileSync('dist/basta/200/index.html','utf8');
          assert.match(site,/basta-six-closing-start/);
          assert.match(site,/basta-six-closing-end/);
          const stylesheet = fs.readFileSync('src/styles/core.css','utf8');
          assert.match(stylesheet,/\.poetry-stanza-number\s*\{/);
          const styles = fs.readdirSync('src/styles').filter(f=>f.endsWith('.css'));
          for (const f of styles) {
            const css = postcss.parse(fs.readFileSync('src/styles/'+f,'utf8'));
            const duplicate = new Set();
            css.walkRules(rule => {
              const props = new Map();
              rule.walkDecls(decl => {
                if(props.get(decl.prop)===decl.value) duplicate.add(rule.selector+' '+decl.prop);
                props.set(decl.prop,decl.value);
              });
            });
            assert.equal(duplicate.size,0,'duplicate property declarations in '+f+': '+[...duplicate].join(', '));
          }
          console.log('Stylesheets:',styles.length,'(expected 9)');
          assert.equal(styles.length,9);
          NODE
          if grep -Rni -E '(basta-verse-fitting|stanza-numbers\.css|basta-stream\.css|initBastaVerseFitting|--basta-verse-min-width|lyric-stanza-number|basta-poem-title)' src --include='*.ts' --include='*.astro' --include='*.css'; then exit 1; fi
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/validate-final-basta-refactor.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete final refactor regression checks"
          git push
