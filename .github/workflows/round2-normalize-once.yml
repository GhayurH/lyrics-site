name: One-time Round 2 normalization
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths: [.github/workflows/round2-normalize-once.yml]
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'GhayurH/lyrics-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round2-kalams-2026-11-14
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Repair Round 2 whitespace
        run: node scripts/tidy-whitespace.mjs --write --changed
      - name: Normalize Bibi ZWNJ policy
        run: node --experimental-strip-types scripts/normalize-bibi.mjs --write
      - name: Normalize Roman transcription
        run: node --experimental-strip-types scripts/normalize-roman.mjs --write
      - name: Reconcile Basta title labels
        run: node scripts/sync-basta-index.mjs
      - name: Validate reviewed Basta fragment assignments
        run: node --experimental-strip-types scripts/refresh-basta-fragments.mjs --check
      - name: Final whitespace cleanup
        run: node scripts/tidy-whitespace.mjs --write --changed
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit normalized content and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/round2-normalize-once.yml
          git add -u
          git commit -m 'chore: apply safe Round 2 source normalization [skip ci]'
          git push origin HEAD:refs/heads/round2-kalams-2026-11-14
