name: One-time Round 2 normalization
on:
  push:
    branches: [round2-kalams-2026-11-14]
    paths: [.github/workflows/round2-normalize-once.yml]
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'GhayurH/lyrics-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round2-kalams-2026-11-14
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete canonical source normalizer
        run: npm run source:sync
      - name: Final whitespace cleanup of Round 2 changes
        run: node scripts/tidy-whitespace.mjs --write --changed
      - name: Verify mechanical changes
        run: git diff --check
      - name: Commit normalized files only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'chore: run complete Round 2 source normalization [skip ci]'
          git push origin HEAD:refs/heads/round2-kalams-2026-11-14
