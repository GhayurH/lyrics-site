name: Validate pre-merge refactor
on:
  push:
    branches:
      - fix/basta-refrain-source-markers-2026-10
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check generated readers and CSS for stale references
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import assert from "node:assert/strict";
          import postcss from "postcss";
          const references = [
            ["dist/basta/200/index.html", "poetry-stanza-number"],
            ["dist/lyrics/aa-asghar-bin-tere/index.html", "poetry-stanza-number"],
            ["dist/lyrics/aa-asghar-bin-tere/index.html", "lyric-stanza"],
            ["dist/basta/200/index.html", "basta-six-closing"],
          ];
          for (const [file, marker] of references) {
            assert.ok(fs.existsSync(file), file + " missing");
            assert.ok(fs.readFileSync(file, "utf8").includes(marker), file + " missing " + marker);
            console.log("PASS: " + file + " contains " + marker);
          }
          const cssDir = "src/styles";
          const styles = fs.readdirSync(cssDir).filter(file => file.endsWith(".css"));
          const seen = new Map();
          const duplicates = [];
          for (const file of styles) {
            const root = postcss.parse(fs.readFileSync(path.join(cssDir, file), "utf8"));
            root.walkRules(rule => {
              const ancestors = [];
              let parent = rule.parent;
              while (parent && parent.type !== "root") {
                if (parent.type === "atrule") ancestors.unshift("@" + parent.name + " " + parent.params);
                parent = parent.parent;
              }
              for (const selector of rule.selectors ?? [rule.selector]) {
                for (const decl of rule.nodes.filter(node => node.type === "decl")) {
                  const key = [ancestors.join("/"), selector.trim(), decl.prop].join(" :: ");
                  const previous = seen.get(key);
                  if (previous && previous.value === decl.value) {
                    duplicates.push({ first: previous.file, next: file, selector, prop: decl.prop });
                  }
                  seen.set(key, { value: decl.value, file });
                }
              }
            });
          }
          console.log("CSS exact duplicate declarations:", JSON.stringify(duplicates.slice(0, 50)));
          assert.ok(!fs.existsSync("src/styles/stanza-numbers.css"));
          assert.ok(!fs.existsSync("src/styles/basta-stream.css"));
          assert.ok(!fs.existsSync("src/client/basta-verse-fitting.ts"));
          console.log("CSS files retained: " + styles.length);
          NODE
          if grep -R -n -E 'basta-verse-fitting|basta-stream\.css|stanza-numbers\.css|initBastaVerseFitting|--basta-verse-min-width' src --include='*.astro' --include='*.ts' --include='*.css'; then
            echo "Stale reference found"
            exit 1
          fi
      - name: Remove validation workflow
        run: |
          git rm .github/workflows/validate-premerge-refactor.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete pre-merge refactor validation"
          git push
