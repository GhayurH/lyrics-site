name: One-time reviewed deletion and ID audit
on:
  push:
    branches:
      - feat/import-overlap-reconciliation-2026-11-05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apply-deletion-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Reconcile precisely the manually deleted files
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python3 -m py_compile scripts/apply-2026-11-15-deletion-audit.py
          python3 scripts/apply-2026-11-15-deletion-audit.py
      - name: Validate locked identities and surviving content
        run: |
          npm ci
          node --experimental-strip-types scripts/recitation-identities.mjs --check
          node scripts/sync-basta-index.mjs --check
          npm run check
          npm test
      - name: Remove one-time tools and commit the four requested files
        run: |
          rm -f scripts/apply-2026-11-15-deletion-audit.py
          rm -f .github/workflows/one-time-basta-id-diagnostics.yml .github/workflows/one-time-deletion-audit.yml
          rm -rf scripts/__pycache__
          git add -A src/data/recitation/identity-lock.json audit/manual-md-review-tracker.csv audit/lyric-md-rounds.csv audit/import-merge-readiness.md scripts/apply-2026-11-15-deletion-audit.py .github/workflows/one-time-basta-id-diagnostics.yml .github/workflows/one-time-deletion-audit.yml
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Reconcile deleted Sibte Jafar duplicates and permanent source IDs [skip ci]"
          git push origin HEAD:feat/import-overlap-reconciliation-2026-11-05
