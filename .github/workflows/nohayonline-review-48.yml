name: Scan NoHayOnline bilingual refrain markers
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-review-48.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Find remaining cross-script refrain matches
        run: |
          python - <<'PY'
          import pathlib,re,collections,subprocess,yaml
          old='86c42ac0efc0895558f4680a0a9da65dc67490d3'
          edited={pathlib.Path(x).stem for x in subprocess.check_output(['git','diff','--name-only',old,'HEAD','--','src/data/lyrics'],text=True).splitlines()}
          front=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          num=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          short=re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          def grp(txt):
              gs=[[]]
              for line in txt.splitlines():
                  v=line.strip()
                  if not v:continue
                  if num.fullmatch(v):gs.append([])
                  else:gs[-1].append(v)
              return gs
          candidates=[]
          hard=[]
          for path in pathlib.Path('src/data/lyrics').glob('*.md'):
              if path.stem in edited:continue
              text=path.read_text(encoding='utf-8')
              if '# source_id: nohayonline:' not in text:continue
              m=front.fullmatch(text)
              if not m:continue
              try:meta=yaml.safe_load(m[1])
              except Exception:continue
              if not isinstance(meta,dict) or not isinstance(meta.get('romanLyrics'),str):continue
              r,u=grp(meta['romanLyrics']),grp(m[2])
              if len(r)!=len(u) or any(len(a)!=len(b) for a,b in zip(r,u)):continue
              v=[];abbrs=[];paints=[];out=[];temp=[];preamble=r[0]
              for a,b in zip(r[1:],u[1:]):
                  for rom,urdu in zip(a,b):
                      if short.search(rom):
                          abbrs.append(rom);paints.append(urdu)
                          if temp:out.append(temp);temp=[]
                      else:temp.append(rom)
              if temp:out.append(temp)
              if len(abbrs)<3 or not out:continue
              counts=collections.Counter(paints)
              variants=[(x,n) for x,n in counts.items() if n<2]
              trailing=sum(1 for a,b in zip(r[1:],u[1:]) if a and short.search(a[-1]))
              shapes=[len(g) for g in out]
              score=min(len(abbrs),len(out))*2+sum(2<=n<=6 for n in shapes)*1.2+min(4,len(preamble))
              item=(score,path.stem,len(preamble),shapes,len(abbrs),len(counts),variants[:3],list(counts.items())[:4],trailing)
              if len(out)>=5 and min(shapes)>=2 and not variants:
                  candidates.append(item)
              else:hard.append(item)
          candidates.sort(reverse=True);hard.sort(reverse=True)
          print('MATCHING_BILINGUAL_REVIEW',len(candidates),'DIFFICULT',len(hard))
          for i,(score,slug,opening,parts,reps,types,variants,examples,trailing) in enumerate(candidates[:160],1):
              print(f'MATCH {i:03d} {slug} score={score:.1f} intro={opening} shapes={parts} shortcuts={reps} types={types} examples={examples} trailing={trailing}')
          for i,(score,slug,opening,parts,reps,types,variants,examples,trailing) in enumerate(hard[:60],1):
              print(f'DIFFICULT {i:03d} {slug} score={score:.1f} intro={opening} shapes={parts} shortcuts={reps} singles={variants} examples={examples}')
          PY
