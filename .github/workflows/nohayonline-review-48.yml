name: Verify 21 NoHayOnline editorial repairs
on:
  push:
    branches: [feat/import-overlap-reconciliation-2026-11-05]
    paths: [.github/workflows/nohayonline-review-48.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python -m pip install pyyaml
      - name: Check substantive lyrics, metadata, and both scripts
        run: |
          python - <<'PY'
          import pathlib,re,subprocess,collections,yaml
          base='3007be2a1ae2f59ecfec3c3d5519a73e4478296f'
          expected=set('''allah-allah-qayamat pisar-ki-laash ay-alamdare-haram akbare-kadiyal-jawan aati-hai-gardoon-se zindan-may-sakina-ko ye-baat-areeze-may maa-aur-ali-akbar bhool-paayi-sakina udao-khaak-ab bhai-bhai-pukarti ye-karbala-hai chal-sakina-chale muslim-ke-shahzade aale-rasool-par ay-baba-hussaina maqame-sahibaz momino-sibte-payambar bazaar-may-beparda badan-se-noke-naiza-tak ay-musalman-aaj'''.split())
          changed=[p for p in subprocess.check_output(['git','diff','--name-only',base,'HEAD','--','src/data/lyrics'],text=True).splitlines() if p.endswith('.md')]
          assert {pathlib.Path(p).stem for p in changed}==expected,('Changed files mismatch',changed)
          front=re.compile(r'\A---\n(.*?)\n---\n(.*)\Z',re.S)
          num=re.compile(r'^(?:[0-9]+|[۰-۹]+)$')
          abbr=re.compile(r'(?:\.{2,}|…|۔۔۔)\s*$')
          digits=str.maketrans('0123456789','۰۱۲۳۴۵۶۷۸۹')
          allowed={
            'akbare-kadiyal-jawan':{'اکبر کڑیل جوان'},
            'ye-baat-areeze-may':{'یہ بات عریضے میں'},
            'maa-aur-ali-akbar':{'ماں اور علی اکبر کی ماں'},
            'bhool-paayi-sakina':{'بھول پایء'},
            'udao-khaak-ab':{'اڑاؤ خاک اب'},
            'bhai-bhai-pukarti':{'…بھائی بھائی پکارتی','…بھائی بھائی پکارت'},
            'ye-karbala-hai':{'یہ کربلا ہے','یہاں سنبھل کر'},
            'chal-sakina-chale':{'چل سکینہ چلیں','ساتھ بابا کے'},
            'muslim-ke-shahzade':{'کوفے میں گھر'},
            'aale-rasool-par':{'ہاے ہاے زینب۔۔۔','آل رسول پر یہ۔۔۔'},
            'ay-baba-hussaina':{'اینا اینا اے بابا حسینا','روتی ہے سکینہ پیاسی ہے۔۔۔'},
            'maqame-sahibaz':{'نہ اس مقام پہ کیوں','یہ وہ زمیں ہے','مقام صاحب الزمان'},
            'momino-sibte-payambar':{'مومنوں سبط پیمبر۔۔۔'},
            'bazaar-may-beparda':{'بازار میں بے پردہ۔۔۔'},
            'badan-se-noke-naiza-tak':{'بدن سے نوکِ نیزہ تک۔۔۔'},
            'ay-musalman-aaj':{'اے مسلماں آج بھی۔۔۔'},
          }
          inline={'aati-hai-gardoon-se','zindan-may-sakina-ko'}
          def parse(t):
              m=front.fullmatch(t)
              assert m,'Broken frontmatter'
              f=yaml.safe_load(m[1]);assert isinstance(f,dict)
              prov=[line for line in m[1].splitlines() if line.startswith(('# source_id:','# source_url:','# raw_sha256:'))]
              return f,m[2],prov
          def lines(t,slug):
              out=[]
              for raw in t.splitlines():
                  x=raw.strip()
                  if not x or num.fullmatch(x):continue
                  if slug in inline:x=re.sub(r'^\d+\)\s*','',x)
                  out.append(x)
              return out
          def verify_content(old,new,slug,script):
              a,b=lines(old,slug),lines(new,slug)
              oc,nc=collections.Counter(a),collections.Counter(b)
              assert not(nc-oc),(slug,script,'Added or edited verse',nc-oc)
              missing=oc-nc
              for line,count in missing.items():
                  if script=='Roman':
                      assert abbr.search(line),(slug,script,'Deleted a substantive line',line)
                  else:
                      assert abbr.search(line) or line in allowed.get(slug,set()),(slug,script,'Deleted a substantive line',line)
              cursor=iter(a)
              for line in b:
                  assert any(original==line for original in cursor),(slug,script,'Reordered lyrics',line)
              return sum(missing.values())
          def groups(t,urdu):
              out=[[]];nums=[]
              for raw in t.splitlines():
                  s=raw.strip()
                  if not s:continue
                  if num.fullmatch(s):nums.append(s);out.append([])
                  else:out[-1].append(s)
              want=[str(i).translate(digits) if urdu else str(i) for i in range(1,len(nums)+1)]
              assert nums==want,('Wrong stanza numbering',nums,want)
              assert nums and all(out),('Empty introduction or stanza',[len(x) for x in out])
              assert all(len(g)>=2 for g in out[1:]),'One-line numbered stanza'
              return out
          removed=collections.Counter()
          special={'aati-hai-gardoon-se','zindan-may-sakina-ko'}
          for path in changed:
              slug=pathlib.Path(path).stem
              rawold=subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
              rawnew=pathlib.Path(path).read_text(encoding='utf-8')
              assert '# source_id: nohayonline:' in rawold,('Wrong origin',path)
              old,ou,op=parse(rawold);new,nu,np=parse(rawnew)
              assert old.get('published') is False and new.get('published') is False,('Publication changed',path)
              assert {k:v for k,v in old.items() if k!='romanLyrics'}=={k:v for k,v in new.items() if k!='romanLyrics'},('Metadata changed',path)
              assert op==np,('Provenance changed',path)
              assert isinstance(old.get('romanLyrics'),str) and isinstance(new.get('romanLyrics'),str),('Missing Roman',path)
              removed['Roman']+=verify_content(old['romanLyrics'],new['romanLyrics'],slug,'Roman')
              removed['Urdu']+=verify_content(ou,nu,slug,'Urdu')
              r,u=groups(new['romanLyrics'],False),groups(nu,True)
              assert len(r)==len(u),(slug,'Mismatched stanza counts')
              if slug not in special:
                  assert [len(g) for g in r]==[len(g) for g in u],(slug,'Mismatched stanza line divisions')
              else:
                  assert [len(g) for g in r][0]==[len(g) for g in u][0],(slug,'Opening differs')
              assert not any(re.match(r'^\d+\)\s',l) for g in r for l in g),'Inline Roman numbers remain'
              print('PASS',slug,'stanzas',len(r)-1,'opening',len(r[0]),'roman_lines',[len(x) for x in r[1:]],'urdu_lines',[len(x) for x in u[1:]])
          assert removed=={'Roman':161,'Urdu':161},('Unexpected deleted line count',dict(removed))
          print('VERIFIED',len(changed),'NoHayOnline lyric files;',dict(removed))
          PY
      - name: Check patch whitespace
        run: git diff --check 3007be2a1ae2f59ecfec3c3d5519a73e4478296f HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Astro check, tests, production build and search
        run: |
          npm run check
          npm test
          npx astro build
          npx pagefind
          node scripts/generate-offline-search-manifest.mjs
